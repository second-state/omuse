<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Order placed : Kaya Mobile</title>
<style>body{font-family:Arial,sans-serif;margin:0;color:#111} header{background:#0f2a3a;color:#fff;padding:10px 16px} main{padding:20px 32px}
h1{color:#067d62}</style></head>
<body><header><b>Kaya Mobile</b></header>
<main><h1>Thank you, your order has been placed.</h1>
<p>Order number: <b>KM-50731</b></p><p id="what"></p><p id="tot"></p><p id="to"></p>
<p>Estimated delivery: 2–3 working days. A confirmation email is on its way.</p></main>
<script>
const q = new URLSearchParams(location.search);
document.getElementById('what').textContent = 'Items: ' + (q.get('items') || '');
document.getElementById('tot').textContent = 'Order total: S$' + (q.get('total') || '');
document.getElementById('to').textContent = 'Delivering to: ' + (q.get('name') || '') + ', ' + (q.get('address') || '');
</script></body></html>

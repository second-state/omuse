<body><h1>TDAC — Thailand Digital Arrival Card</h1>
<p>All foreign nationals submit the TDAC <b>within 3 days before arrival</b>. Free of charge at tdac.immigration.go.th. Transit passengers who do not pass immigration are exempt.</p>
<p>Passport validity: at least 6 months on the date of entry.</p>

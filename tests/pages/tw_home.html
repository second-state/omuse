<!doctype html>
<!-- TWAC home and notice, after the real twac.immigration.gov.tw (2026-10-31): "Submit Arrival Card" → /notice → START
     → /submit. -->
<html lang="en"><head><meta charset="utf-8"><title>TWAC Taiwan Arrival Card</title><style>
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f3f6fa}header{background:#0b3d91;color:#fff;padding:14px 30px;font-weight:bold}
main{max-width:900px;margin:22px auto;background:#fff;border:1px solid #d7d9dd;padding:24px 30px}a.tile{display:block;border:1px solid #d7d9dd;padding:16px;margin:10px 0;color:#0b3d91;text-decoration:none;font-weight:bold}
button{height:40px;padding:0 26px;border:0;border-radius:4px;background:#0b3d91;color:#fff;font-size:15px;cursor:pointer}</style></head>
<body><header>TWAC Taiwan Arrival Card · NATIONAL IMMIGRATION AGENCY</header><main id="m"></main>
<script>
const m = document.getElementById('m');
if (location.pathname.startsWith('/notice')) {
  m.innerHTML = '<h1>Notice</h1><p>Each traveller submits the arrival card online before arrival. A verification code is emailed to you.</p><button type="button" id="start">START</button>';
  document.getElementById('start').onclick = () => { location.href = '/submit'; };
} else {
  m.innerHTML = '<h1>Taiwan Arrival Card</h1><a class="tile" href="/notice">Submit Arrival Card<br><small>Provide your arrival details for your upcoming trip.</small></a><a class="tile" href="#">Update Arrival Card</a>';
}
</script></body></html>

<!doctype html>
<html><head><title>SG Arrival Card (test)</title></head>
<body>
<h1>SG Arrival Card — Foreign Visitors</h1>
<p>Submit within 3 days before arrival. Free of charge.</p>
<form action="/sgac_done.html" method="get">
  <label>Full name (as in passport) <input type="text" name="name"></label>
  <label>Date of birth <input type="text" name="dob" placeholder="YYYY-MM-DD"></label>
  <label>Nationality <input type="text" name="nationality"></label>
  <label>Passport number <input type="text" name="passport"></label>
  <label>Passport expiry <input type="text" name="expiry"></label>
  <label>Arrival flight <input type="text" name="flight"></label>
  <label>Arrival date <input type="text" name="arrival"></label>
  <label>Accommodation <input type="text" name="hotel"></label>
  <label>Fever, cough or rash in the last days? <select name="health"><option>No</option><option>Yes</option></select></label>
  <label>Visited Africa or South America in the last 6 days? <select name="yf"><option>No</option><option>Yes</option></select></label>
  <button type="submit">Submit declaration</button>
</form>
</body></html>

<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>WorldTracer — Track your delayed baggage</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>body{font-family:Arial,sans-serif;margin:0;color:#222} header{background:#004b87;color:#fff;padding:14px 32px;font-size:18px}
main{max-width:820px;margin:24px auto;padding:0 24px} input{padding:6px;border:1px solid #999} button{background:#004b87;color:#fff;border:0;padding:7px 16px}
table{border-collapse:collapse;margin-top:12px} th,td{border:1px solid #ddd;padding:8px 12px;text-align:left} th{background:#eef3f8}
footer{margin:40px 0 0;padding:14px 32px;background:#eee;font-size:12px}</style></head>
<body>
<header>WorldTracer® Baggage Tracing</header>
<main>
<h1>Track your delayed baggage</h1>
<form method="get" action="/bagtrace.html">
<label>File reference <input name="ref" id="ref" placeholder="e.g. NRTSQ12345" size="14"></label>
<label>Family name <input name="name" id="name" size="14"></label>
<button type="submit">Track</button></form>
<div id="out"></div>
<script>
  const q = new URLSearchParams(location.search);
  const ref = (q.get('ref') || q.get('file') || q.get('reference') || '').toUpperCase().replace(/\s+/g, '');
  const y = new Date(Date.now() - 86400000);
  const day = y.getFullYear() + '-' + String(y.getMonth() + 1).padStart(2, '0') + '-' + String(y.getDate()).padStart(2, '0');
  if (ref) {
    document.getElementById('ref').value = ref; document.getElementById('name').value = q.get('name') || '';
    const out = document.getElementById('out');
    if (/^[A-Z]{3}[A-Z0-9]{2}\d{5}$/.test(ref)) {
      out.innerHTML = '<h2>File ' + ref + '</h2><table>' +
        '<tr><th>Status</th><td><b>Tracing continues</b> — your bag has not been located yet</td></tr>' +
        '<tr><th>Bag</th><td>Black hard-shell suitcase, tag SQ 123456</td></tr>' +
        '<tr><th>Flight</th><td>SQ 638 Singapore (SIN) – Tokyo Narita (NRT), ' + day + '</td></tr>' +
        '<tr><th>Last update</th><td>' + day + ' 22:10 local time — trace sent to Singapore (SIN)</td></tr>' +
        '<tr><th>Delivery address on file</th><td>Hotel Ginza Grand, 1-1-1 Ginza, Chuo City, Tokyo</td></tr></table>' +
        '<p>Bags are usually found within a few days. A bag not found within 21 days is considered lost: the airline then handles your claim for the contents.</p>';
    } else {
      out.innerHTML = '<p>No file found for this reference. Check the reference on your Property Irregularity Report.</p>';
    }
  }
</script>
</main>
<footer>WorldTracer is operated for participating airlines.</footer>
</body></html>

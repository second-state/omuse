<!doctype html>
<html><head><meta charset="utf-8"><title>Travel insurance application — FWD Singapore (test)</title></head>
<body>
<h1>Your details</h1>
<p class="note">Test stand-in for FWD Singapore's application page. Nothing is charged or sent anywhere.</p>
<p id="summary"></p>
<script>
  const q = new URLSearchParams(location.search);
  document.getElementById('summary').textContent = 'Plan: ' + (q.get('plan') || '?') + ' — premium SGD ' + (q.get('premium') || '?');
</script>
<form id="apply" action="/fwd_sg_done.html" method="get">
  <label>Full name (as in passport) <input name="name" id="name"></label><br>
  <label>Date of birth <input name="dob" id="dob" placeholder="YYYY-MM-DD"></label><br>
  <label>Email <input name="email" id="email"></label><br>
  <label>Mobile number <input name="mobile" id="mobile"></label><br>
  <label>Passport number <input name="passport" id="passport"></label><br>
  <h2>Payment</h2>
  <label>Card number <input name="card" id="card" autocomplete="cc-number"></label><br>
  <label>Expiry <input name="exp" id="exp" placeholder="MM/YY" autocomplete="cc-exp"></label><br>
  <label>CVC <input name="cvc" id="cvc" autocomplete="cc-csc"></label><br>
  <label>Name on card <input name="holder" id="holder" autocomplete="cc-name"></label><br>
  <button type="submit" id="pay">Pay now</button>
</form>
</body></html>

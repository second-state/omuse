<!doctype html>
<!-- China's online arrival card, after the real s.nia.gov.cn/ArrivalCardFillingPC (mapped from the live site on
     2026-10-31): entry-registation-home ("Entry Declaration") → entry-registation-notice ("I AGREE") →
     entry-registation-form, an Element UI form in steps on one URL. Fields have no ids or names: each sits in a
     div.el-form-item under its label; selects open a dropdown of li.el-select-dropdown__item attached to the page;
     nationality is filterable; the birth date is three selects; cities come from a "Popular Cities" popup
     (ul.hot-city li); radios are label.el-radio. Simplified here: step 1's passport-photo upload takes a document code
     instead of a file (the user's step either way), and Submit sits on Travel Information (the real site asks about
     companions first). Submit writes the chosen values into the hidden named fields read on /cn_arrival_done.html. -->
<html lang="en"><head><meta charset="utf-8"><title>Arrival Card Filling</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;font-size:14px;background:#f2f4f7}
header{background:#c8102e;color:#fff;padding:12px 28px;font-weight:bold}main{max-width:900px;margin:18px auto;background:#fff;border:1px solid #d7d9dd;padding:20px 30px 110px}
.el-steps{display:flex;gap:8px;font-size:12px;margin-bottom:14px}.el-steps span{padding:4px 10px;border-radius:12px;background:#eceff3}.el-steps span.on{background:#c8102e;color:#fff}
.el-form-item{margin:0 0 14px}.el-form-item__label{display:block;font-weight:bold;font-size:13px;margin-bottom:4px}.el-form-item__content{position:relative;display:flex;gap:8px}
.el-input input,textarea{height:34px;border:1px solid #9aa0a6;border-radius:4px;padding:4px 8px;font-size:14px;width:100%}textarea{height:60px}
.el-select{flex:1}.el-select input{cursor:pointer}.el-select-dropdown{position:absolute;background:#fff;border:1px solid #9aa0a6;z-index:20;max-height:220px;overflow:auto;min-width:200px}
.el-select-dropdown ul,.hot-city{list-style:none;margin:0;padding:4px}.el-select-dropdown__item,.hot-city li{padding:6px 10px;cursor:pointer}.el-select-dropdown__item:hover,.hot-city li:hover{background:#fbeaec}
.el-radio{border:1px solid #c8102e;border-radius:4px;padding:6px 14px;cursor:pointer;margin-right:8px}.el-radio.is-checked{background:#c8102e;color:#fff}
.tile{display:inline-block;border:1px solid #d7d9dd;padding:16px;margin:8px;cursor:pointer;font-weight:bold}.hidden{display:none}
button{height:40px;padding:0 24px;border:0;border-radius:4px;background:#c8102e;color:#fff;font-size:15px;cursor:pointer}
.bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:2px solid #c8102e;padding:12px 28px;display:flex;justify-content:flex-end;z-index:9}
</style></head><body><header>National Immigration Administration · Arrival Card Filling</header><main id="main"></main>
<div id="pops"></div>
<script>
(function () {
  const BASE = '/ArrivalCardFillingPC/';
  const main = document.getElementById('main'), pops = document.getElementById('pops');
  const path = location.pathname.replace(BASE, '').replace(/\/$/, '');
  if (path === '' || path === 'ArrivalCardFillingPC') { history.replaceState(null, '', BASE + 'entry-registation-home'); }
  const page = location.pathname.replace(BASE, '');
  if (page === 'entry-registation-home') {
    main.innerHTML = '<h1>Arrival Card Filling</h1><div class="tile" id="t1">Entry Declaration</div><div class="tile">Entry Declaration for Border Area Residents</div>';
    document.getElementById('t1').onclick = () => { location.href = BASE + 'entry-registation-notice'; };
    return;
  }
  if (page === 'entry-registation-notice') {
    main.innerHTML = '<h1>Instructions</h1><p>Please read the instructions before filling in the arrival card.</p><button type="button" id="agree">I AGREE</button>';
    document.getElementById('agree').onclick = () => { location.href = BASE + 'entry-registation-form'; };
    return;
  }
  // --- the form: Element UI-like fields, found by their labels
  const item = (label, content) => `<div class="el-form-item"><label class="el-form-item__label">${label}</label><div class="el-form-item__content">${content}</div></div>`;
  const sel = (key, ph = 'Please select') => `<div class="el-select" data-sel="${key}"><div class="el-input"><input type="text" readonly placeholder="${ph}"></div></div>`;
  const filt = key => `<div class="el-select" data-sel="${key}" data-filter="1"><div class="el-input"><input type="text" placeholder="Please select"></div></div>`;
  const txt = key => `<div class="el-input" style="flex:1"><input type="text" data-key="${key}"></div>`;
  const radios = (key, opts) => opts.map(o => `<label class="el-radio" data-r="${key}" data-v="${o}">${o}</label>`).join('');
  const years = Array.from({length: 100}, (_, i) => String(2026 - i)), mm = Array.from({length: 12}, (_, i) => String(i + 1).padStart(2, '0'));
  const dd = Array.from({length: 31}, (_, i) => String(i + 1).padStart(2, '0'));
  const LISTS = {sex: ['Male', 'Female'], year: years, month: mm, day: dd,
    nation: ['Aruba（ABW）', 'Australia（AUS）', 'Austria（AUT）', 'Canada（CAN）', 'France（FRA）', 'Japan（JPN）', 'New Zealand（NZL）', 'United Kingdom（GBR）'],
    mode: ['Vessel', 'Flight', 'Train', 'Automobile'], port: [], visa: ['Yes', 'No'],
    policy: ['Visa-free Entry', '24-hour Temporary Entry for Transit', '240-hour Visa-free Transit', 'Emergency'],
    purpose: ['Conference/Business', 'Visit', 'Sightseeing/Leisure', 'Visiting Relatives', 'Study']};
  const PORTS = {Shanghai: ['Shanghai Hongqiao International Airport（007）', 'Shanghai Pudong International Airport（055）'],
                 Beijing: ['Beijing Capital International Airport（001）', 'Beijing Daxing International Airport（117）']};
  main.innerHTML = `<div class="el-steps"><span data-s="1">Uploading ID Document Page</span><span data-s="2">Basic Information</span><span data-s="3">Personal Information</span><span data-s="4">Travel Information</span></div>
  <form id="f" action="/cn_arrival_done.html" method="get" autocomplete="off" novalidate>
  <section data-step="1"><h2>Uploading ID Document Page</h2>${item('Upload ID Document Page', '<input type="file" accept="image/*">')}
    ${item('Document code (from the uploaded page)', '<div class="el-input" style="flex:1"><input type="text" name="captcha" id="code"></div>')}<button type="submit" id="up">Next</button></section>
  <section data-step="2" class="hidden"><h2>Basic Information</h2>
    ${item('Last Name', txt('ywx'))}${item('First Name', txt('ywm'))}${item('Gender', sel('sex'))}
    ${item('Date of Birth', sel('year', 'Year') + sel('month', 'Month') + sel('day', 'Day'))}
    ${item('Country/Region of Citizenship', filt('nation'))}${item('Passport Number', txt('idNumber'))}
    ${item('Entry Transportation Mode', sel('mode'))}${item('Arrival Flight/Train/Vessel Number', txt('rjjtbc'))}
    ${item('City of Entry', '<div class="el-input" style="flex:1"><input type="text" readonly data-city="entry" placeholder="Please select"></div>')}
    ${item('Port of Entry', sel('port'))}<button type="button" class="next" data-to="3">Next</button></section>
  <section data-step="3" class="hidden"><h2>Personal Information</h2>
    ${item('Contact Number', txt('jwdh'))}${item('Email', txt('email'))}${item('Do you hold a valid visa or other entry permit?', sel('visa'))}
    <div id="policyItem" class="hidden">${item('Entry Policy Selection', sel('policy'))}</div><button type="button" class="next" data-to="4">Next</button></section>
  <section data-step="4" class="hidden"><h2>Travel Information</h2>
    ${item('Purpose of Entry', sel('purpose'))}${item('Date of Entry', '<div class="el-input" style="flex:1"><input type="text" data-key="rjrq" placeholder="yyyy-MM-dd"></div>')}
    ${item('Destination Cities in China', '<div class="el-input" style="flex:1"><input type="text" readonly data-city="dest" placeholder="Please select"></div>')}
    ${item('Address in China', '<div style="flex:1"><div class="el-input"><input type="text" readonly placeholder="Province / City / District"></div><textarea data-key="zhxxzz"></textarea></div>')}
    ${item('Do you have any inviting entities or inviters in China?', radios('invite', ['Yes', 'No']))}
    ${item('Confirmed Departure Itinerary', radios('departure', ['Yes', 'No']))}
    <div class="bar"><button type="submit" id="submit">Submit</button></div></section>
  <div class="hidden"><input name="family_name"><input name="given_name"><input name="sex"><input name="dob"><input name="nationality"><input name="passport_no">
    <input name="email"><input name="phone"><input name="mode"><input name="flight_no"><input name="arrival_date"><input name="purpose"><input name="accommodation"></div></form>`;
  const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
  const show = (el, on) => el.classList.toggle('hidden', !on);
  const val = {};
  // Enter confirms a date or a field, as in the real app; it never submits the form
  document.getElementById('f').addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.type !== 'submit') e.preventDefault(); });
  let at = 1;
  const step = n => { at = n; $$('section[data-step]').forEach(s => show(s, +s.dataset.step === n)); $$('.el-steps span').forEach(s => s.classList.toggle('on', +s.dataset.s === n));
    history.replaceState(null, '', BASE + 'entry-registation-form' + (n > 1 ? '#step' + n : '')); };
  const m = location.hash.match(/^#step(\d)$/); step(m ? +m[1] : 1);
  $('#up').addEventListener('click', e => { if (at !== 1) return; e.preventDefault(); if ($('#code').value.trim().toUpperCase() === 'T6QZ4') step(2); });
  $$('button.next').forEach(b => b.addEventListener('click', () => step(+b.dataset.to)));
  // selects: a dropdown attached to the page, like Element UI's
  const open = (anchor, items, onPick) => { pops.innerHTML = ''; const r = anchor.getBoundingClientRect();
    const d = document.createElement('div'); d.className = 'el-select-dropdown'; d.style.left = (r.left + scrollX) + 'px'; d.style.top = (r.bottom + scrollY) + 'px';
    d.innerHTML = '<ul>' + items.map(o => `<li class="el-select-dropdown__item">${o}</li>`).join('') + '</ul>'; pops.appendChild(d);
    d.addEventListener('click', e => { const li = e.target.closest('li'); if (!li) return; onPick(li.textContent); pops.innerHTML = ''; }); return d; };
  $$('.el-select').forEach(s => { const inp = s.querySelector('input'), key = s.dataset.sel;
    const items = () => key === 'port' ? (PORTS[val.entryCity] || []) : key === 'day' ? (val.year && val.month ? dd : []) : LISTS[key];
    const pick = t => { inp.value = t; val[key] = t; if (key === 'visa') show($('#policyItem'), t === 'No'); };
    inp.addEventListener('click', () => open(inp, items(), pick));
    if (s.dataset.filter) inp.addEventListener('input', () => { const q = inp.value.trim().toLowerCase(); open(inp, items().filter(o => o.toLowerCase().includes(q)), pick); }); });
  // the city picker: Popular Cities
  $$('input[data-city]').forEach(inp => inp.addEventListener('click', () => { pops.innerHTML = ''; const r = inp.getBoundingClientRect();
    const d = document.createElement('div'); d.className = 'el-select-dropdown'; d.style.left = (r.left + scrollX) + 'px'; d.style.top = (r.bottom + scrollY) + 'px';
    d.innerHTML = '<b>Popular Cities</b><ul class="hot-city">' + ['Beijing', 'Tianjin', 'Shanghai', 'Guangzhou', 'Shenzhen'].map(c => `<li>${c}</li>`).join('') + '</ul>'; pops.appendChild(d);
    d.addEventListener('click', e => { const li = e.target.closest('li'); if (!li) return; inp.value = li.textContent;
      if (inp.dataset.city === 'entry') { val.entryCity = li.textContent; val.port = ''; $('.el-select[data-sel="port"] input').value = ''; } pops.innerHTML = ''; }); }));
  $$('.el-radio').forEach(l => l.addEventListener('click', () => { $$(`.el-radio[data-r="${l.dataset.r}"]`).forEach(x => x.classList.remove('is-checked')); l.classList.add('is-checked'); val['r_' + l.dataset.r] = l.dataset.v; }));
  const k = key => ($(`input[data-key="${key}"], textarea[data-key="${key}"]`) || {}).value || '';
  const iso = v => { const mm = (v || '').match(/^(\d{4})-(\d{2})-(\d{2})$/); return mm ? `${mm[3]}/${mm[2]}/${mm[1]}` : ''; };
  $('#f').addEventListener('submit', e => {
    if (at === 1) { e.preventDefault(); if ($('#code').value.trim().toUpperCase() === 'T6QZ4') step(2); return; }
    if (at !== 4) { e.preventDefault(); return; }
    const fl = k('rjjtbc').toUpperCase().match(/^([A-Z0-9]{2})0*(\d+)$/);
    const out = {family_name: k('ywx').toUpperCase(), given_name: k('ywm').toUpperCase(), sex: {Male: 'M', Female: 'F'}[val.sex] || '',
      dob: val.year && val.month && val.day ? `${val.day}/${val.month}/${val.year}` : '', nationality: ((val.nation || '').match(/（([A-Z]{3})）/) || [])[1] || '',
      passport_no: k('idNumber'), email: k('email').toLowerCase(), phone: k('jwdh'), mode: val.mode === 'Flight' ? 'AIR' : (val.mode || '').toUpperCase(),
      flight_no: fl ? fl[1] + ' ' + fl[2] : k('rjjtbc'), arrival_date: iso(k('rjrq')),
      purpose: val.purpose === 'Sightseeing/Leisure' ? 'HOLIDAY' : (val.purpose || '').toUpperCase(), accommodation: k('zhxxzz')};
    for (const [key, x] of Object.entries(out)) { const i = document.querySelector(`#f input[name="${key}"]`); if (i) i.value = x; }
  });
})();
</script></body></html>

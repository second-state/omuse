<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>eClaimsLine — Claim received | Card Benefit Services</title>
<style>
  body { margin: 0; font: 14px/1.4 Arial, Helvetica, sans-serif; color: #1d2733; background: #f2f5f8; }
  header { background: #0b3a64; color: #fff; padding: 10px 28px; font-size: 20px; font-weight: bold; }
  main { max-width: 900px; margin: 16px auto; background: #fff; border: 1px solid #d7dee6; border-radius: 6px; padding: 16px 26px; }
  td { padding: 3px 14px 3px 0; } td:first-child { color: #5a6875; }
</style></head>
<body>
<header>eClaimsLine</header>
<main>
  <h1>Claim received</h1>
  <p>Your claim number is <b id="claimno">CBS-26-118204</b>. Keep it for all correspondence.</p>
  <table id="summary"></table>
  <p>Next: upload your documents (claim form, physician statement, itinerary, card statement, the supplier's refund
    statement) within 90 days of the date of loss. A confirmation has been emailed to you.</p>
</main>
<script>
  const q = new URLSearchParams(location.search), t = document.getElementById('summary');
  for (const [k, label] of [['benefit', 'Benefit'], ['name', 'Cardholder'], ['card', 'Card'], ['loss', 'Date of loss'], ['amount', 'Amount claimed (USD)']]) {
    const tr = document.createElement('tr');
    tr.innerHTML = '<td></td><td></td>'; tr.children[0].textContent = label; tr.children[1].textContent = q.get(k) || '—';
    t.appendChild(tr);
  }
</script>
</body></html>

<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Kaya Mobile</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>body{font-family:Arial,sans-serif;margin:0;color:#111} header{background:#0f2a3a;color:#fff;padding:10px 16px;display:flex;gap:16px} header a{color:#fff}
main{display:flex;gap:32px;padding:20px 32px} .img{width:320px;height:320px;border-radius:8px;background:linear-gradient(135deg,#ff9800,#fff)}
.info{flex:1;max-width:560px} h1{font-size:22px} .price{font-size:26px;font-weight:bold;margin:8px 0} .box{border:1px solid #ddd;border-radius:8px;padding:16px;width:240px;height:fit-content}
button{display:block;width:100%;padding:10px;border-radius:20px;border:0;margin:8px 0;font-size:15px;cursor:pointer} #add{background:#ffd814} #now{background:#ffa41c}
#msg{color:#067d62;font-weight:bold;min-height:20px} ul{padding-left:18px}</style></head>
<body><header><a href="/kaya_search.html"><b>Kaya Mobile</b></a><span style="flex:1"></span><a href="/kaya_cart.html" id="cart">Cart (0)</a></header>
<main><div class="img"></div>
<div class="info"><h1 id="t"></h1><div id="r"></div><div class="price" id="p"></div>
<label>Colour: <select id="colour"></select></label>
<ul><li>Precise cut-outs for buttons and the camera</li><li>Raised edges protect the screen and lenses</li><li>Works with wireless and MagSafe charging</li></ul></div>
<div class="box"><div class="price" id="p2"></div><div>FREE delivery in 2–3 working days</div><div>In stock</div>
<button id="add" aria-label="Add to Cart">Add to Cart</button><button id="now">Buy Now</button>
<div id="msg" role="status"></div><a href="/kaya_cart.html" id="go" hidden>Go to cart</a></div></main>
<script>
const CAT = {"lumi-crystal": {"title": "Lumi Crystal Clear Case for iPhone 17 Pro Max, Anti-Scratch", "rating": 4.9, "ratings": 38, "price": 17.9, "colours": ["Clear"]}, "titan-pro": {"title": "Titan Pro Shockproof Case for iPhone 17 Pro (6.3-inch), Military Grade", "rating": 4.9, "ratings": 860, "price": 22.9, "colours": ["Black", "Blue"]}, "basic-clear": {"title": "Basic Clear Case for iPhone 17 Pro Max, MagSafe Compatible", "rating": 4.1, "ratings": 120, "price": 12.9, "colours": ["Clear"]}, "rugged-armor": {"title": "Rugged Armor Case for iPhone 17 Pro Max, Drop Tested 3 m", "rating": 4.2, "ratings": 1157, "price": 15.9, "colours": ["Black", "Olive"]}, "everyday-black": {"title": "Everyday Matte Case for iPhone 17 Pro Max \u2013 Black", "rating": 3.9, "ratings": 2310, "price": 9.9, "colours": ["Black"]}, "everyday-navy": {"title": "Everyday Matte Case for iPhone 17 Pro Max \u2013 Navy", "rating": 3.8, "ratings": 1034, "price": 9.9, "colours": ["Navy"]}, "glitter-sparkle": {"title": "Glitter Sparkle Case for iPhone 17 Pro Max", "rating": 4.0, "ratings": 455, "price": 14.9, "colours": ["Gold", "Silver"]}, "marble": {"title": "Marble Pattern Case for iPhone 17 Pro Max", "rating": 3.7, "ratings": 88, "price": 11.9, "colours": ["White marble"]}, "wood-grain": {"title": "Wood Grain Case for iPhone 17 Pro Max, Real Walnut", "rating": 4.3, "ratings": 76, "price": 26.9, "colours": ["Walnut"]}, "kickstand": {"title": "Kickstand Case for iPhone 17 Pro Max, MagSafe Ring Stand", "rating": 4.8, "ratings": 379, "price": 33.9, "colours": ["Black", "Titanium"]}, "folio-wallet": {"title": "Folio Wallet Case for iPhone 17 Pro Max, 3 Card Slots", "rating": 4.3, "ratings": 642, "price": 29.9, "colours": ["Brown", "Black"]}, "card-holder": {"title": "Card Holder Case for iPhone 17 Pro Max", "rating": 4.0, "ratings": 301, "price": 19.9, "colours": ["Black"]}, "anti-yellow": {"title": "Anti-Yellow Clear Case for iPhone 17 Pro Max", "rating": 4.2, "ratings": 915, "price": 13.9, "colours": ["Clear"]}, "leather-sleeve": {"title": "Leather Sleeve Pouch for iPhone 17 Pro Max", "rating": 4.6, "ratings": 88, "price": 39.9, "colours": ["Tan"]}, "battery-case": {"title": "Battery Case 5000mAh for iPhone 17 Pro Max", "rating": 4.1, "ratings": 204, "price": 59.9, "colours": ["Black"]}, "waterproof": {"title": "Waterproof Phone Pouch, fits iPhone 17 Pro Max", "rating": 3.6, "ratings": 1520, "price": 8.9, "colours": ["Clear"]}, "silicone-sage": {"title": "Liquid Silicone Case for iPhone 17 Pro Max \u2013 Sage", "rating": 4.3, "ratings": 1401, "price": 17.9, "colours": ["Sage"]}, "lens-protector": {"title": "Camera Lens Protector for iPhone 17 Pro Max, 2-Pack", "rating": 4.8, "ratings": 2770, "price": 9.9, "colours": ["Clear"]}, "clear-16": {"title": "Crystal Clear Case for iPhone 16 Pro Max", "rating": 4.8, "ratings": 5120, "price": 11.9, "colours": ["Clear"]}, "magsafe-silicone": {"title": "MagSafe Silicone Case for iPhone 17 Pro Max", "rating": 4.4, "ratings": 2048, "price": 19.9, "colours": ["Midnight", "Stone", "Coral"]}, "crossbody": {"title": "Crossbody Lanyard Case for iPhone 17 Pro Max", "rating": 4.5, "ratings": 154, "price": 23.9, "colours": ["Black strap", "Beige strap"]}, "carbon-fibre": {"title": "Carbon Fibre Case for iPhone 17 Pro Max, Ultra Thin 0.6 mm", "rating": 4.5, "ratings": 268, "price": 18.9, "colours": ["Matte black"]}, "privacy-screen": {"title": "Privacy Screen Protector for iPhone 17 Pro Max, 2-Pack", "rating": 4.6, "ratings": 3302, "price": 12.9, "colours": ["Clear"]}, "slim-leather": {"title": "Slim Leather Case for iPhone 17 Pro Max, MagSafe Compatible", "rating": 4.6, "ratings": 512, "price": 24.9, "colours": ["Saddle Brown", "Midnight Black"]}, "rugged-holster": {"title": "Rugged Holster Case for iPhone 17 Pro Max with Belt Clip", "rating": 4.4, "ratings": 190, "price": 27.9, "colours": ["Black"]}, "aurora-glitter": {"title": "Aurora Glitter Case for iPhone 17 Pro Max, MagSafe Compatible", "rating": 4.7, "ratings": 1203, "price": 21.9, "colours": ["Aurora Pink", "Aurora Blue"]}, "bumper": {"title": "Aluminium Bumper Frame for iPhone 17 Pro Max", "rating": 3.9, "ratings": 233, "price": 16.9, "colours": ["Silver"]}, "kids": {"title": "Kids Foam Case for iPhone 17 Pro Max", "rating": 4.0, "ratings": 61, "price": 14.9, "colours": ["Red", "Blue"]}};
const id = new URLSearchParams(location.search).get('id'), it = CAT[id];
const cart = () => { try { return JSON.parse(localStorage.getItem('kaya_cart') || '[]'); } catch (e) { return []; } };
const show = () => { document.getElementById('cart').textContent = 'Cart (' + cart().length + ')'; };
if (!it) { document.getElementById('t').textContent = 'This item is no longer available'; }
else {
  document.title = it.title + ' : Kaya Mobile';
  document.getElementById('t').textContent = it.title;
  document.getElementById('r').textContent = it.rating.toFixed(1) + ' out of 5 stars · ' + it.ratings.toLocaleString('en-US') + ' ratings';
  document.getElementById('p').textContent = document.getElementById('p2').textContent = 'S$' + it.price.toFixed(2);
  const sel = document.getElementById('colour'); it.colours.forEach(c => { const o = document.createElement('option'); o.textContent = c; sel.append(o); });
  const put = () => { const c = cart(); c.push({ id, title: it.title, colour: sel.value, price: it.price }); localStorage.setItem('kaya_cart', JSON.stringify(c)); show(); };
  document.getElementById('add').onclick = () => { put(); document.getElementById('msg').textContent = 'Added to Cart: ' + it.title + ' (' + sel.value + ')';
    document.getElementById('go').hidden = false; };
  document.getElementById('now').onclick = () => { put(); location.href = '/kaya_checkout.html'; };
}
show();
</script></body></html>

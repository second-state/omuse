<body><h1>Lost or stolen passport: emergency travel document</h1>
<p>Consular section open Monday–Friday 09:00–12:00. Bring: a police report, two passport photos, a copy of the lost passport, your flight booking. Emergency line: <b>+81 3 0000 1234</b>. Most emergency passports are issued within 2 working days.</p>

<!doctype html>
<!-- The Korea e-Arrival card form, after the real /portal/apply/individual.do (mapped from the live site on 2026-10-31):
     it renders after a few seconds under a "[Required] Upload the photo of the passport bio-page" popup (closing it
     leaves manual entry); the declarant's inputs are classes inside .info_wrap.applyNo01; nationality and airline are
     type-to-filter dropdowns (options in div.nat-options-value / div.cno-options-value); birth date and passport
     expiry three selects (the day enabled once year and month are set); arrival and departure dates jQuery UI
     datepickers (YYYY-MM-DD); the address in Korea comes from a lookup popup, the hotel name goes in the detail
     address. Submit asks for the code emailed to the user (the user's part). Submit writes the chosen values into the
     hidden named fields read on /kr_arrival_done.html. -->
<html lang="en"><head><meta charset="utf-8"><title>Submit e-Arrival card | Official Korea e-Arrival card</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;font-size:14px;background:#f4f6fa}
header{background:#003478;color:#fff;padding:14px 32px;font-weight:bold}main{max-width:980px;margin:18px auto;background:#fff;border:1px solid #d7d9dd;padding:20px 32px 28px}
h2{font-size:16px;color:#003478;border-bottom:1px solid #d7d9dd;padding-bottom:4px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 24px}
.f{display:flex;flex-direction:column;position:relative}.f>label{font-weight:bold;font-size:13px;margin-bottom:3px}
input,select{height:32px;border:1px solid #9aa0a6;border-radius:3px;padding:4px 8px;font-size:14px;background:#fff}input[readonly]{background:#f6f7f9}
.row3{display:flex;gap:6px}.dpn{display:none}.opts{position:absolute;top:56px;left:0;right:0;background:#fff;border:1px solid #9aa0a6;z-index:5;max-height:200px;overflow:auto}
.opts>div[class$=options-value]{padding:6px 8px;cursor:pointer}.opts>div[class$=options-value]:hover{background:#eef}
.popBox{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:20}.popBox>div{background:#fff;padding:20px;width:460px}
button{height:36px;padding:0 18px;border:1px solid #003478;border-radius:4px;background:#fff;color:#003478;cursor:pointer}button.on{background:#003478;color:#fff}
button[type=submit]{background:#003478;color:#fff;height:42px;font-size:15px}#loading{padding:40px;text-align:center}
.code{display:flex;gap:12px;align-items:center;margin-top:16px}
</style></head><body><header>Official Korea e-Arrival card</header><main>
<div id="loading">Loading the form…</div>
<form id="apply" class="dpn" action="/kr_arrival_done.html" method="get" autocomplete="off" novalidate>
<h1>Submit e-Arrival card</h1>
<div class="info_wrap applyNo01">
  <h2>Basic information</h2>
  <div class="grid">
    <div class="f"><label>Surname (as shown on passport)</label><input type="text" class="ps_fmnm"></div>
    <div class="f"><label>Given name (as shown on passport)</label><input type="text" class="ps_gvnm"></div>
    <div class="f"><label>Date of birth</label><div class="row3"><select class="btd_year"></select><select class="btd_month"></select><select class="btd_day" disabled></select></div></div>
    <div class="f"><label>Country/region (nationality)</label><input type="text" class="info_nat" readonly placeholder="Select">
      <div class="opts nat-options dpn"><input type="text" class="info-nat-content" placeholder="Search"><div class="list"></div></div></div>
    <div class="f"><label>Passport number</label><input type="text" class="ps_no"></div>
    <div class="f"><label>Sex</label><select class="sd_cd"><option value="">Select</option><option value="F">Female</option><option value="M">Male</option><option value="X">Third gender</option></select></div>
    <div class="f"><label>Passport expiration date</label><div class="row3"><select class="ps_expr_year"></select><select class="ps_expr_month"></select><select class="ps_expr_day" disabled></select></div></div>
  </div>
  <h2>Detailed information</h2>
  <div class="grid">
    <div class="f"><label>Means of arrival</label><div><button type="button" class="btnEntAir">AIR</button> <button type="button" class="btnEntSea">SEA</button></div></div>
    <div class="f"><label>Date of arrival</label><input type="text" class="ent_prr_ymd" readonly placeholder="YYYY-MM-DD"></div>
    <div class="f"><label>Flight number - airline</label><input type="text" class="ent_cno_cd" readonly placeholder="Select">
      <div class="opts cno-options dpn"><input type="text" class="str-cno-content" placeholder="Search"><div class="list"></div></div></div>
    <div class="f"><label>Flight number</label><input type="text" class="ent_cno_nm"></div>
    <div class="f"><label>Means of departure</label><div><button type="button" class="btnDepAir">AIR</button> <button type="button" class="btnDepSea">SEA</button></div></div>
    <div class="f"><label>Date of departure</label><input type="text" class="dep_prr_ymd" readonly placeholder="YYYY-MM-DD"></div>
    <div class="f"><label>Purpose of entry</label><select class="ent_purp_cd"><option value="">Select</option><option value="01">Tourism (individual)</option><option value="02">Tourism (group)</option><option value="03">Business</option><option value="05">Study</option><option value="06">Visiting family</option><option value="99">Others</option></select></div>
    <div class="f"><label>Intended place of stay</label><div><button type="button" class="btnAddrKor">KOR</button> <button type="button" class="btnAddrEng">ENG</button></div>
      <input type="text" class="soj_prrpl_rnm_bs_eng_addr" readonly placeholder="Basic address (from the lookup)" style="margin-top:4px">
      <input type="text" class="soj_prrpl_rnm_det_addr" placeholder="Detailed address / accommodation name" style="margin-top:4px"></div>
    <div class="f"><label>Contact Information</label><input type="text" class="soj_prrar_tel"></div>
    <div class="f"><label>Job</label><select class="occp_cd"><option value="">Select</option><option value="01">Office worker</option><option value="02">Self-employed</option><option value="03">Student</option><option value="99">Others</option></select></div>
    <div class="f"><label>Email</label><input type="text" class="rep_eml_addr" readonly></div>
  </div>
</div>
<div class="code"><span>Enter the verification code sent to your email:</span><input type="text" name="captcha" id="captcha" style="width:120px"></div>
<p><button type="submit" id="btnSubmit">Submit</button></p>
<div class="dpn"><input name="family_name"><input name="given_name"><input name="sex"><input name="dob"><input name="nationality"><input name="passport_no">
  <input name="passport_expiry"><input name="email"><input name="mode"><input name="flight_no"><input name="arrival_date"><input name="departure_date">
  <input name="purpose"><input name="accommodation"></div>
</form>
<div class="popBox dpn" id="photoPop"><div><h3>[Required] Upload the photo of the passport bio-page</h3><p>Your details are filled from the photo.</p>
  <input type="file" accept="image/*"> <button type="button" class="popClose">Close</button></div></div>
</main>
<script>
(function () {
  const q = s => document.querySelector('.info_wrap.applyNo01 ' + s);
  const email = new URLSearchParams(location.search).get('email') || '';
  // the form renders after a few seconds, under the passport-photo popup
  // (opened from the terms page, as the real site does; a copy opened directly renders at once, without the popup)
  const fromTerms = /agreementPolicy/.test(document.referrer);
  setTimeout(() => { document.getElementById('loading').remove(); document.getElementById('apply').classList.remove('dpn');
    if (fromTerms) document.getElementById('photoPop').classList.remove('dpn'); q('input.rep_eml_addr').value = email; }, fromTerms ? 2500 : 0);
  document.querySelector('#photoPop .popClose').addEventListener('click', () => document.getElementById('photoPop').remove());
  const fill = (sel, items, first) => { const s = q(sel); s.innerHTML = `<option value="">${first}</option>` + items.map(v => `<option value="${v}">${v}</option>`).join(''); };
  const years = n0 => Array.from({length: 120}, (_, i) => String(n0 - i)), months = Array.from({length: 12}, (_, i) => String(i + 1).padStart(2, '0'));
  const days = Array.from({length: 31}, (_, i) => String(i + 1).padStart(2, '0'));
  fill('select.btd_year', years(2026), 'Year'); fill('select.btd_month', ['00', ...months], 'Month'); fill('select.btd_day', ['00', ...days], 'Day');
  fill('select.ps_expr_year', Array.from({length: 15}, (_, i) => String(2026 + i)), 'Year'); fill('select.ps_expr_month', months, 'Month'); fill('select.ps_expr_day', days, 'Day');
  [['btd_year', 'btd_month', 'btd_day'], ['ps_expr_year', 'ps_expr_month', 'ps_expr_day']].forEach(([y, m, d]) => [y, m].forEach(k => q('select.' + k)
    .addEventListener('change', () => { q('select.' + d).disabled = !(q('select.' + y).value && q('select.' + m).value); })));
  // the type-to-filter dropdowns
  const NAT = [['AUS', 'AUSTRALIA'], ['AUT', 'AUSTRIA'], ['CAN', 'CANADA'], ['CHN', 'CHINA P. R.'], ['GBR', 'UK-BRITISH CITIZEN(GBR)'], ['JPN', 'JAPAN'], ['NZL', 'NEW ZEALAND'], ['USA', 'U.S.A']];
  const AIR = [['KE', '대한항공(KOREAN AIRLINE) (KE)'], ['OZ', '아시아나항공(ASIANA AIRLINES) (OZ)'], ['QF', '콴타스항공(QANTAS AIRWAYS) (QF)'], ['DL', '델타항공(DELTA AIRLINES) (DL)'], ['8B', 'BUSINESS AIR CO., LTD (8B)']];
  const dropdown = (open, box, search, items, cls, onPick) => {
    q(open).addEventListener('click', () => { q(box).classList.remove('dpn'); q(search).focus(); render(); });
    const render = () => { const t = q(search).value.trim().toUpperCase();
      q(box + ' .list').innerHTML = items.filter(([c, n]) => !t || n.toUpperCase().includes(t) || c === t).map(([c, n]) => `<div class="${cls}" data-code="${c}">${n}</div>`).join(''); };
    q(search).addEventListener('keyup', render);
    q(box + ' .list').addEventListener('click', e => { const o = e.target.closest('.' + cls); if (!o) return; onPick(o.dataset.code, o.textContent); q(box).classList.add('dpn'); });
  };
  dropdown('input.info_nat', '.nat-options', 'input.info-nat-content', NAT, 'nat-options-value', (c, n) => { q('input.info_nat').value = n; q('input.info_nat').dataset.code = c; });
  dropdown('input.ent_cno_cd', '.cno-options', 'input.str-cno-content', AIR, 'cno-options-value', (c, n) => { q('input.ent_cno_cd').value = n; q('input.ent_cno_cd').dataset.code = c; q('input.ent_cno_nm').value = c; });
  // AIR / SEA toggles
  ['btnEntAir', 'btnEntSea'].forEach(b => q('button.' + b).addEventListener('click', e => { q('button.btnEntAir').classList.remove('on'); q('button.btnEntSea').classList.remove('on'); e.target.classList.add('on'); }));
  ['btnDepAir', 'btnDepSea'].forEach(b => q('button.' + b).addEventListener('click', e => { q('button.btnDepAir').classList.remove('on'); q('button.btnDepSea').classList.remove('on'); e.target.classList.add('on'); }));
  // a minimal jQuery with the jQuery UI datepicker the page uses (YYYY-MM-DD)
  window.jQuery = sel => { const el = typeof sel === 'string' ? document.querySelector(sel) : sel; return {
    datepicker(cmd, v) { if (cmd === 'setDate' && el) { el.value = v; el.dispatchEvent(new Event('change', {bubbles: true})); } return this; } }; };
  window.$ = window.jQuery;
  const purp = {'01': 'HOLIDAY', '02': 'HOLIDAY', '03': 'BUSINESS', '05': 'STUDY', '06': 'FAMILY', '99': 'OTHERS'};
  const dmy = (y, m, d) => (y && m && d) ? `${d}/${m}/${y}` : '';
  const iso = v => { const m = (v || '').match(/^(\d{4})-(\d{2})-(\d{2})$/); return m ? `${m[3]}/${m[2]}/${m[1]}` : ''; };
  document.getElementById('apply').addEventListener('submit', () => {
    const fl = (q('input.ent_cno_nm').value || '').toUpperCase().match(/^([A-Z0-9]{2})0*(\d+)$/);
    const v = {family_name: q('input.ps_fmnm').value.toUpperCase(), given_name: q('input.ps_gvnm').value.toUpperCase(), sex: q('select.sd_cd').value,
      dob: dmy(q('select.btd_year').value, q('select.btd_month').value, q('select.btd_day').value),
      nationality: q('input.info_nat').dataset.code || '', passport_no: q('input.ps_no').value,
      passport_expiry: dmy(q('select.ps_expr_year').value, q('select.ps_expr_month').value, q('select.ps_expr_day').value),
      email: q('input.rep_eml_addr').value.toLowerCase(), mode: q('button.btnEntAir').classList.contains('on') ? 'AIR' : q('button.btnEntSea').classList.contains('on') ? 'SEA' : '',
      flight_no: fl ? fl[1] + fl[2] : q('input.ent_cno_nm').value, arrival_date: iso(q('input.ent_prr_ymd').value), departure_date: iso(q('input.dep_prr_ymd').value),
      purpose: purp[q('select.ent_purp_cd').value] || '',
      accommodation: [q('input.soj_prrpl_rnm_bs_eng_addr').value, q('input.soj_prrpl_rnm_det_addr').value].filter(Boolean).join(', ')};
    for (const [k, x] of Object.entries(v)) { const i = document.querySelector(`#apply input[name="${k}"]`); if (i) i.value = x; }
  });
})();
</script></body></html>

<body><h1>ETIAS</h1><p><b>ETIAS is not yet in operation.</b> No applications are being collected at this time. The system is expected to start in 2027; travellers will be informed several months in advance. Entry/Exit System (EES): biometric registration at the border, no action needed before travel.</p></body></html>

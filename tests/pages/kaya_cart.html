<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Shopping Cart : Kaya Mobile</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>body{font-family:Arial,sans-serif;margin:0;color:#111} header{background:#0f2a3a;color:#fff;padding:10px 16px} header a{color:#fff}
main{padding:20px 32px;max-width:900px} .row{display:flex;gap:16px;border-bottom:1px solid #ddd;padding:10px 0;align-items:center} .row span{flex:1}
.go{display:inline-block;background:#ffd814;color:#111;padding:10px 24px;border-radius:20px;text-decoration:none;margin-top:16px}</style></head>
<body><header><a href="/kaya_search.html"><b>Kaya Mobile</b></a></header>
<main><h1>Shopping Cart</h1><div id="items"></div><p id="sub"></p>
<a class="go" href="/kaya_checkout.html" id="checkout">Proceed to checkout</a></main>
<script>
const cart = () => { try { return JSON.parse(localStorage.getItem('kaya_cart') || '[]'); } catch (e) { return []; } };
const draw = () => {
  const c = cart(), box = document.getElementById('items'); box.innerHTML = '';
  if (!c.length) box.textContent = 'Your Kaya Mobile cart is empty.';
  c.forEach((x, i) => { const r = document.createElement('div'); r.className = 'row';
    r.innerHTML = '<span></span><b></b><button>Delete</button>'; r.querySelector('span').textContent = x.title + ' — Colour: ' + x.colour;
    r.querySelector('b').textContent = 'S$' + x.price.toFixed(2);
    r.querySelector('button').onclick = () => { const k = cart(); k.splice(i, 1); localStorage.setItem('kaya_cart', JSON.stringify(k)); draw(); };
    box.append(r); });
  document.getElementById('sub').textContent = 'Subtotal (' + c.length + ' item' + (c.length === 1 ? '' : 's') + '): S$' + c.reduce((s, x) => s + x.price, 0).toFixed(2);
};
draw();
</script></body></html>

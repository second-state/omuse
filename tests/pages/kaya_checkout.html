<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Checkout : Kaya Mobile</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>body{font-family:Arial,sans-serif;margin:0;color:#111} header{background:#0f2a3a;color:#fff;padding:10px 16px;height:24px} header a{color:#fff}
form{display:flex;gap:40px;padding:16px 32px} .left{width:520px} h2{font-size:18px;margin:10px 0 6px} label{display:block;margin:6px 0;font-size:14px}
input{padding:6px;border:1px solid #999;width:300px;display:block;margin-top:2px} .sum{width:360px;border:1px solid #ddd;border-radius:8px;padding:16px;height:330px;overflow:hidden}
#place{background:#ffd814;border:0;border-radius:20px;padding:12px;width:100%;font-size:16px;cursor:pointer;margin:0 0 12px} #lines{font-size:13px;max-height:150px;overflow:hidden}
.tot{font-weight:bold;font-size:18px;border-top:1px solid #ddd;padding-top:8px}</style></head>
<body><header><a href="/kaya_search.html"><b>Kaya Mobile</b></a> · Secure checkout</header>
<form action="/kaya_done.html" method="get">
<div class="left"><h2>1. Delivery address</h2>
<label>Full name <input name="name" id="name" autocomplete="name"></label>
<label>Mobile number <input name="phone" id="phone" autocomplete="tel"></label>
<label>Address <input name="address" id="address" autocomplete="street-address"></label>
<h2>2. Payment method</h2>
<label>Card number <input name="card" id="card" autocomplete="cc-number"></label>
<label>Expiry (MM/YY) <input name="exp" id="exp" autocomplete="cc-exp"></label>
<label>Security code (CVC) <input name="cvc" id="cvc" autocomplete="cc-csc"></label></div>
<div class="sum"><button type="submit" id="place">Place your order</button>
<div style="font-size:12px;color:#555;margin-bottom:8px">By placing your order you agree to Kaya Mobile's conditions of sale.</div>
<h2>Order summary</h2><div id="lines"></div><p>Delivery: FREE (2–3 working days)</p><p class="tot" id="tot"></p>
<input type="hidden" name="items" id="items"><input type="hidden" name="total" id="total"></div>
</form>
<script>
let c = []; try { c = JSON.parse(localStorage.getItem('kaya_cart') || '[]'); } catch (e) {}
const lines = document.getElementById('lines');
if (!c.length) lines.textContent = 'Your cart is empty.';
c.forEach(x => { const d = document.createElement('div'); d.textContent = x.title + ' (' + x.colour + ') — S$' + x.price.toFixed(2); lines.append(d); });
const t = c.reduce((s, x) => s + x.price, 0).toFixed(2);
document.getElementById('tot').textContent = 'Order total: S$' + t;
document.getElementById('items').value = c.map(x => x.title + ' (' + x.colour + ')').join('; ');
document.getElementById('total').value = t;
document.querySelector('form').addEventListener('submit', () => localStorage.setItem('kaya_cart', '[]'));
</script></body></html>

<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Parcelly messaging</title>
<style>body{font-family:Arial,sans-serif;margin:0;display:flex;flex-direction:column;height:100vh;font-size:14px} .head{background:#2e4a3f;color:#fff;padding:10px}
#log{flex:1;padding:10px;overflow:auto} #log div{margin:6px 0} .row{display:flex;border-top:1px solid #ddd} input{flex:1;padding:10px;border:0}</style></head>
<body><div class="head">Parcelly Home · Messaging</div>
<div id="log"><div>Mei (Parcelly): Hello! Ask me anything about delivery, assembly or your order.</div></div>
<div class="row"><input aria-label="Message" placeholder="Write a message…"><button aria-label="Send">Send</button></div>
<script>
const log = document.getElementById('log'), inp = document.querySelector('input');
const add = t => { const d = document.createElement('div'); d.textContent = t; log.appendChild(d); log.scrollTop = 1e6; };
const answer = q => /deliver|shipping|how long|arriv|when/i.test(q)
  ? 'Sofas and other furniture are delivered in 6–8 working days. Assembly by our team costs S$39 per item and is booked at checkout.'
  : /assembl/i.test(q) ? 'Assembly by our team costs S$39 per item and is booked at checkout.'
  : 'Could you tell me your order number or what you would like to know?';
const send = () => { const q = inp.value.trim(); if (!q) return; add('You: ' + q); inp.value = '';
  setTimeout(() => add('Mei (Parcelly): ' + answer(q)), 1200); };
document.querySelector('button').onclick = send;
inp.addEventListener('keydown', e => { if (e.key === 'Enter') send(); });
</script></body></html>

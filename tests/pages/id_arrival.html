<!doctype html>
<!-- All Indonesia, after the real allindonesia.imigrasi.go.id (mapped from the live site on 2026-10-31): an Indonesian
     home page with a Languages menu and the "Foreign Visitor" tile, then four steps on their own paths
     (/arrival-card-submission/personal-information, /travel-details/individual, /mode-of-transport/foreigner,
     /declaration/individual). Ids carry a session suffix; dropdowns are readonly inputs that open a Search box and a
     list; gender and the Yes / No questions are readonly inputs to click; dates DD/MM/YYYY; the arrival date a list of
     the allowed days ("DD MONTH YYYY"). The certification and Submit end it (the user's). Submit writes the chosen
     values into the hidden named fields read on /id_arrival_done.html. -->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>All Indonesia</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;font-size:14px;background:#f5f6f8;color:#1b1b1b}
header{background:#8b1b1b;color:#fff;padding:12px 28px;display:flex;justify-content:space-between;align-items:center}
main{max-width:900px;margin:18px auto;background:#fff;border:1px solid #d7d9dd;padding:20px 30px 110px}
.tiles{display:flex;gap:18px}.tile{flex:1;border:1px solid #d7d9dd;padding:18px;cursor:pointer;font-weight:bold;text-align:center}
.field{margin:0 0 12px;position:relative}.field>label{display:block;font-weight:bold;font-size:13px;margin-bottom:4px}
input[type=text],textarea{height:34px;border:1px solid #9aa0a6;border-radius:4px;padding:4px 8px;font-size:14px;width:100%}textarea{height:60px}
input[readonly]{cursor:pointer;background:#fff}.choice{display:flex;gap:10px}.choice input{width:120px;text-align:center}.choice input.on{background:#8b1b1b;color:#fff}
.dd{position:absolute;left:0;right:0;top:58px;background:#fff;border:1px solid #9aa0a6;z-index:5;padding:6px;max-height:220px;overflow:auto}
.dd .opt{padding:6px 8px;cursor:pointer}.dd .opt:hover{background:#f1e7e7}.hidden{display:none}
.bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:2px solid #8b1b1b;padding:12px 28px;display:flex;justify-content:space-between;align-items:center;z-index:9}
button{height:40px;padding:0 24px;border:0;border-radius:4px;background:#8b1b1b;color:#fff;font-size:15px;cursor:pointer}button[disabled]{opacity:.5}
.lang{position:relative}.lang .menu{position:absolute;right:0;top:34px;background:#fff;color:#000;border:1px solid #ccc}.lang .menu div{padding:6px 14px;cursor:pointer}
</style></head><body>
<header><b>ALL INDONESIA</b><div class="lang"><button type="button" id="langBtn">Languages</button><div class="menu hidden" id="langMenu"><div>Bahasa Indonesia</div><div>English</div></div></div></header>
<main>
<section id="home"><h1 data-en="Arrival declaration" data-ind="Deklarasi kedatangan">Deklarasi kedatangan</h1>
  <div class="tiles"><div class="tile" data-en="Indonesian Citizen" data-ind="Warga Negara Indonesia">Warga Negara Indonesia</div>
    <div class="tile" id="wna" data-en="Foreign Visitor" data-ind="Warga Negara Asing">Warga Negara Asing</div></div></section>
<form id="f" class="hidden" action="/id_arrival_done.html" method="get" autocomplete="off" novalidate>
  <section data-path="personal-information"><h2>Personal Information</h2>
    <div class="field"><label>Passport/Country/Region</label><input type="text" readonly data-dd="country" data-id="spi_nationality_"></div>
    <div class="field"><label>Full Name</label><input type="text" data-id="spi_full_name_"></div>
    <div class="field"><label>Date of Birth</label><input type="text" placeholder="DD/MM/YYYY" data-id="spi_dob_"></div>
    <div class="field"><label>Country/Place of Birth</label><input type="text" readonly data-dd="country" data-id="spi_country_or_place_of_birth_"></div>
    <div class="field"><label>Gender</label><div class="choice" data-id="spi_gender_"><input type="text" readonly value="MALE"><input type="text" readonly value="FEMALE"></div></div>
    <div class="field"><label>Passport Number</label><input type="text" data-id="spi_passport_no_"></div>
    <div class="field"><label>Date of Passport Expiry</label><input type="text" placeholder="DD/MM/YYYY" data-id="spi_date_of_passport_expiry_"></div>
    <div class="field"><label>Have you ever used a passport under different nationality/region to enter Indonesia?</label>
      <div class="choice" data-id="spi_diff_passport_"><input type="text" readonly value="Yes"><input type="text" readonly value="No"></div></div>
    <div class="field"><label>Mobile Number</label><span id="code">Select</span> <input type="text" data-id="spi_mobile_no_" style="width:70%"></div>
    <div class="field"><label>Email</label><input type="text" data-id="spi_email_"></div>
    <button type="button" data-next="travel-details/individual">Next</button></section>
  <section data-path="travel-details/individual" class="hidden"><h2>Travel Details</h2>
    <div class="field"><label>Arrival Date to Indonesia</label><input type="text" readonly value="Select" data-dd="arrival" data-id="std_arrival_date_foreigner_individual"></div>
    <div class="field"><label>Departure Date from Indonesia</label><input type="text" placeholder="DD/MM/YYYY" data-id="std_departure_date_foreigner_individual"></div>
    <div class="field"><label>Do you already have a Visa or Stay Permit?</label>
      <div class="choice" data-id="std_do_have_visa_kitas_kitap_foreigner_individual"><input type="text" readonly value="Yes"><input type="text" readonly value="No"></div></div>
    <button type="button" data-next="mode-of-transport/foreigner">Next</button></section>
  <section data-path="mode-of-transport/foreigner" class="hidden"><h2>Mode of Transportation &amp; Address</h2>
    <div class="field"><label>Mode of Transport</label><input type="text" readonly data-dd="mode" data-id="smta_mode_transport_foreigner"></div>
    <div class="field air hidden"><label>Port of Entry</label><input type="text" readonly data-dd="port" data-id="smta_place_of_arrival_air_foreigner"></div>
    <div class="field air hidden"><label>Type of Air Transport</label><input type="text" readonly data-dd="airtype" data-id="smta_air_transport_type_foreigner"></div>
    <div class="field air hidden"><label>Flight Name</label><input type="text" readonly data-dd="airline" data-id="smta_flight_name_foreigner"></div>
    <div class="field air hidden"><label>Flight Number</label><input type="text" data-id="smta_flight_no_foreigner"></div>
    <div class="field"><label>Purpose of Travel</label><input type="text" readonly data-dd="purpose" data-id="smta_purpose_travel_foreigner"></div>
    <div class="field"><label>Type of Accommodation</label><input type="text" readonly data-dd="restype" data-id="smta_residence_type_foreigner"></div>
    <div class="field hotel hidden"><label>Name of Hotel</label><input type="text" readonly data-dd="hotel" data-id="smta_hotel_name_foreigner"></div>
    <div class="field res hidden"><label>Address in Indonesia</label><textarea data-id="smta_residential_address_foreigner"></textarea></div>
    <button type="button" data-next="declaration/individual">Next</button></section>
  <section data-path="declaration/individual" class="hidden"><h2>Declaration</h2>
    <div class="field"><label>Do you currently have any of the following symptoms: fever, cough, shortness of breath, rash or yellowing of the skin/eyes?</label>
      <div class="choice" data-q="symptoms"><input type="text" readonly value="Yes"><input type="text" readonly value="No"></div></div>
    <div class="field"><label>Are you bringing any animals, fish, plants, and/or their processed products?</label>
      <div class="choice" data-q="animals"><input type="text" readonly value="Yes"><input type="text" readonly value="No"></div></div>
    <div class="field"><label>Do you carry goods that must be declared to Customs?</label>
      <div class="choice" data-q="customs"><input type="text" readonly value="Yes"><input type="text" readonly value="No"></div></div>
    <div class="field"><label>Are you bringing Mobile Phones, Handheld Computers, or Tablet Computers purchased abroad?</label>
      <div class="choice" data-q="imei"><input type="text" readonly value="Yes"><input type="text" readonly value="No"></div></div>
    <div class="bar"><label><input type="checkbox" name="declaration" id="certify"> I, the Applicant hereby certify that I understand and agree all the Information and Declaration.</label>
      <button type="submit" id="submit" disabled>Submit</button></div></section>
  <div class="hidden"><input name="name"><input name="sex"><input name="dob"><input name="nationality"><input name="passport_no"><input name="passport_expiry">
    <input name="email"><input name="phone"><input name="mode"><input name="flight_no"><input name="arrival_date"><input name="departure_date">
    <input name="purpose"><input name="accom_type"><input name="accommodation"><input name="h_symptoms"><input name="d_animals"><input name="d_goods"></div>
</form></main>
<script>
(function () {
  const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
  const show = (el, on) => el.classList.toggle('hidden', !on);
  const sfx = String(Date.now());   // ids carry a session suffix, as on the real site
  $$('[data-id]').forEach(e => { e.id = e.dataset.id + sfx; });
  const BASE = '/arrival-card-submission/';
  // language
  $('#langBtn').addEventListener('click', () => show($('#langMenu'), $('#langMenu').classList.contains('hidden')));
  $$('#langMenu div').forEach(d => d.addEventListener('click', () => { const en = d.textContent === 'English';
    $$('[data-en]').forEach(e => { e.textContent = en ? e.dataset.en : e.dataset.ind; }); show($('#langMenu'), false); }));
  const go = path => { show($('#home'), false); show($('#f'), true); $$('#f section').forEach(s => show(s, s.dataset.path === path));
    if (location.pathname !== BASE + path) history.pushState(null, '', BASE + path); };
  $('#wna').addEventListener('click', () => go('personal-information'));
  const at = location.pathname.startsWith(BASE) ? location.pathname.slice(BASE.length) : '';
  if (at) go(at);
  $$('button[data-next]').forEach(b => b.addEventListener('click', () => go(b.dataset.next)));
  // choices: readonly inputs to click
  $$('.choice').forEach(g => g.querySelectorAll('input').forEach(i => i.addEventListener('click', () => {
    g.querySelectorAll('input').forEach(x => x.classList.remove('on')); i.classList.add('on'); g.dataset.value = i.value;
    g.dispatchEvent(new Event('change')); })));
  // dropdowns: a Search box and a list of options (plain elements, no roles)
  const MON = ['JANUARY', 'FEBRUARY', 'MARCH', 'APRIL', 'MAY', 'JUNE', 'JULY', 'AUGUST', 'SEPTEMBER', 'OCTOBER', 'NOVEMBER', 'DECEMBER'];
  const day = n => { const d = new Date(); d.setDate(d.getDate() + n); return `${String(d.getDate()).padStart(2, '0')} ${MON[d.getMonth()]} ${d.getFullYear()}`; };
  const LISTS = {
    country: ['AUSTRALIA', 'AUSTRIA', 'CANADA', 'CHINA', 'JAPAN', 'MALAYSIA', 'NEW ZEALAND', 'SINGAPORE', 'UNITED KINGDOM', 'UNITED STATES OF AMERICA'],
    arrival: [-1, 0, 1, 2].map(day), mode: ['AIR', 'LAND', 'SEA'],
    port: ['CGK - SOEKARNO-HATTA AIRPORT', 'DPS - I GUSTI NGURAH RAI AIRPORT', 'SUB - JUANDA AIRPORT', 'KNO - KUALANAMU AIRPORT'],
    airtype: ['COMMERCIAL FLIGHT', 'GOVERNMENT FLIGHT', 'CHARTER FLIGHT'],
    airline: ['AIRASIA', 'GARUDA INDONESIA', 'JETSTAR', 'QANTAS AIRWAYS', 'SINGAPORE AIRLINES', 'VIRGIN AUSTRALIA'],
    purpose: ['1-DAY TRANSIT', 'BUSINESS/MEETING/CONFERENCE/CONVENTION/EXHIBITION', 'EDUCATION/TRAINING', 'HOLIDAY/SIGHTSEEING/LEISURE', 'VISITING FRIENDS/RELATIVES'],
    restype: ['RESIDENTIAL', 'HOTEL', 'OTHERS'],
    hotel: ['SEMINYAK LAGOON RESORT, BADUNG', 'SEMINYAK BEACH HOTEL, BADUNG', 'THE LEGIAN BALI, BADUNG', 'KUTA PARADISO HOTEL, BADUNG'],
  };
  const CODES = {AUSTRALIA: '+61', JAPAN: '+81', SINGAPORE: '+65', 'UNITED KINGDOM': '+44', MALAYSIA: '+60'};
  $$('input[data-dd]').forEach(inp => {
    const box = document.createElement('div'); box.className = 'dd hidden'; inp.after(box);
    const list = LISTS[inp.dataset.dd], searchable = inp.dataset.dd !== 'arrival';
    box.innerHTML = (searchable ? '<input type="text" placeholder="Search">' : '') + '<div class="items"></div>';
    const render = () => { const q = searchable ? box.querySelector('input').value.trim().toUpperCase() : '';
      box.querySelector('.items').innerHTML = list.filter(o => !q || o.includes(q)).map(o => `<div class="opt">${o}</div>`).join(''); };
    inp.addEventListener('click', () => { $$('.dd').forEach(d => d !== box && show(d, false)); show(box, true); render(); if (searchable) box.querySelector('input').focus(); });
    if (searchable) box.querySelector('input').addEventListener('input', render);
    box.querySelector('.items').addEventListener('click', e => { const o = e.target.closest('.opt'); if (!o) return;
      inp.value = o.textContent.replace(/, [A-Z ]+$/, inp.dataset.dd === 'hotel' ? '' : '$&'); inp.dataset.picked = o.textContent; show(box, false);
      inp.dispatchEvent(new Event('change', {bubbles: true})); });
  });
  $('[data-id="spi_nationality_"]').addEventListener('change', e => { $('#code').textContent = CODES[e.target.value] || 'Select'; });
  $('[data-id="smta_mode_transport_foreigner"]').addEventListener('change', e => $$('.air').forEach(x => show(x, e.target.value === 'AIR')));
  $('[data-id="smta_residence_type_foreigner"]').addEventListener('change', e => { $$('.hotel').forEach(x => show(x, e.target.value === 'HOTEL'));
    $$('.res').forEach(x => show(x, e.target.value === 'RESIDENTIAL')); });
  $('#certify').addEventListener('change', e => { $('#submit').disabled = !e.target.checked; });
  const v = id => ($(`[data-id="${id}"]`) || {}).value || '', ch = q => ($(`.choice[data-q="${q}"]`) || {dataset: {}}).dataset.value || '';
  const ISO = {AUSTRALIA: 'AUS', JAPAN: 'JPN', SINGAPORE: 'SGP', 'UNITED KINGDOM': 'GBR', MALAYSIA: 'MYS', CANADA: 'CAN'};
  const parseDay = s => { const m = (s || '').match(/^(\d{2}) ([A-Z]+) (\d{4})$/); return m ? `${m[1]}/${String(MON.indexOf(m[2]) + 1).padStart(2, '0')}/${m[3]}` : ''; };
  $('#f').addEventListener('submit', () => {
    const air = (v('smta_flight_name_foreigner') || '').toUpperCase(), num = v('smta_flight_no_foreigner');
    const codes = {'GARUDA INDONESIA': 'GA', 'QANTAS AIRWAYS': 'QF', 'SINGAPORE AIRLINES': 'SQ', 'JETSTAR': 'JQ', 'VIRGIN AUSTRALIA': 'VA', AIRASIA: 'AK'};
    const out = {name: v('spi_full_name_').toUpperCase(), sex: {MALE: 'M', FEMALE: 'F'}[($('.choice[data-id="spi_gender_"]').dataset.value || '')] || '',
      dob: v('spi_dob_'), nationality: ISO[v('spi_nationality_')] || '', passport_no: v('spi_passport_no_'), passport_expiry: v('spi_date_of_passport_expiry_'),
      email: v('spi_email_').toLowerCase(), phone: ($('#code').textContent !== 'Select' ? $('#code').textContent + ' ' : '') + v('spi_mobile_no_'),
      mode: v('smta_mode_transport_foreigner'), flight_no: codes[air] && num ? codes[air] + ' ' + num : '',
      arrival_date: parseDay(v('std_arrival_date_foreigner_individual')), departure_date: v('std_departure_date_foreigner_individual'),
      purpose: v('smta_purpose_travel_foreigner').startsWith('HOLIDAY') ? 'HOLIDAY' : v('smta_purpose_travel_foreigner'),
      accom_type: v('smta_residence_type_foreigner') === 'RESIDENTIAL' ? 'OWN' : v('smta_residence_type_foreigner'),
      accommodation: v('smta_residence_type_foreigner') === 'HOTEL' ? v('smta_hotel_name_foreigner') : v('smta_residential_address_foreigner'),
      h_symptoms: ch('symptoms'), d_animals: ch('animals'), d_goods: ch('customs')};
    for (const [k, x] of Object.entries(out)) { const i = document.querySelector(`#f input[name="${k}"]`); if (i) i.value = x; }
  });
})();
</script></body></html>

<!doctype html>
<!-- The TWAC form, after the real twac.immigration.gov.tw/submit (mapped from the live site on 2026-10-31): step 1
     Email Verification (an email, a check and an emailed code — the user's), then on the same URL Traveler
     Information, Itinerary and Review. Ids are traveler1_<field>; dates DD/MM/YYYY text; nationality, calling code and
     flight code are comboboxes that take the exact option text ("AUS,AUSTRALIA", "61 AUS", "CI : CHINA AIRLINES");
     radios are labels inside .radioGrp. Review has the declaration and SUBMIT (the user's), in a bar fixed to the
     bottom, and the address ends in #review there. Submit writes the chosen values into the hidden named fields read
     on /twac_done.html. -->
<html lang="en"><head><meta charset="utf-8"><title>TWAC Taiwan Arrival Card</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;font-size:14px;background:#f3f6fa}
header{background:#0b3d91;color:#fff;padding:14px 30px;font-weight:bold}main{max-width:900px;margin:18px auto;background:#fff;border:1px solid #d7d9dd;padding:20px 30px 110px}
.steps{display:flex;gap:8px;font-size:12px;margin-bottom:12px}.steps span{padding:4px 10px;border-radius:12px;background:#e8ecf3}.steps span.on{background:#0b3d91;color:#fff}
.f{margin:0 0 12px;position:relative}.f>label{display:block;font-weight:bold;font-size:13px;margin-bottom:4px}
input[type=text],input[type=email],select{height:34px;border:1px solid #9aa0a6;border-radius:4px;padding:4px 8px;font-size:14px;width:100%}
.radioGrp{display:flex;gap:10px}.radioGrp label.btnStyle{border:1px solid #0b3d91;border-radius:4px;padding:6px 14px;cursor:pointer}.radioGrp label.btnStyle.on{background:#0b3d91;color:#fff}
.radioGrp input{display:none}.menu{position:absolute;left:0;right:0;top:58px;background:#fff;border:1px solid #9aa0a6;z-index:5}.menu .opt{padding:6px 8px;cursor:pointer}.menu .opt:hover{background:#eef2fa}
.hidden{display:none}button{height:40px;padding:0 26px;border:0;border-radius:4px;background:#0b3d91;color:#fff;font-size:15px;cursor:pointer}button[disabled]{opacity:.5}
.bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:2px solid #0b3d91;padding:12px 30px;display:flex;justify-content:space-between;align-items:center;z-index:9}
</style></head><body><header>TWAC Taiwan Arrival Card · NATIONAL IMMIGRATION AGENCY</header><main>
<div class="steps"><span data-s="1">1 Email Verification</span><span data-s="2">2 Traveler Information</span><span data-s="3">3 Itinerary</span><span data-s="4">4 Review</span><span data-s="5">5 Confirmation</span></div>
<form id="f" action="/twac_done.html" method="get" autocomplete="off" novalidate>
<section data-step="1"><h2>Email Verification</h2>
  <div class="f"><label>Email Address*</label><input type="email" name="email_verify" id="emailVerify"></div>
  <p><button type="button" id="send">SEND VERIFICATION CODE</button></p>
  <div class="f"><label>Enter Verification Code</label><input type="text" name="captcha" id="code"></div>
  <p><button type="submit" id="verify">VERIFY CODE</button></p></section>
<section data-step="2" class="hidden"><h2>Traveler Information</h2>
  <div class="f"><label>Date of Entry Taiwan (DD/MM/YYYY)*</label><input type="text" id="traveler1_expectEntryDate"></div>
  <div class="f"><label>Expected Departure Taiwan Date (DD/MM/YYYY)*</label><input type="text" id="traveler1_intendedDepartureDate"></div>
  <div class="f"><label>English Name*</label><input type="text" id="traveler1_englishName"></div>
  <div class="f"><label>Passport Number*</label><input type="text" id="traveler1_passportNo"></div>
  <div class="f"><label>Date of Passport Expiry (DD/MM/YYYY)*</label><input type="text" id="traveler1_passportExpiryDate"></div>
  <div class="f"><label>Sex*</label><div class="radioGrp"><label class="btnStyle"><input type="radio" id="traveler1_sex" value="Male">MALE</label><label class="btnStyle"><input type="radio" value="Female">FEMALE</label></div></div>
  <div class="f"><label>Date of Birth (DD/MM/YYYY)*</label><input type="text" id="traveler1_birthDate"></div>
  <div class="f"><label>Nationality*</label><input type="text" id="traveler1_nation" data-list="country"></div>
  <div class="f"><label>Visa Type*</label><div class="radioGrp"><label class="btnStyle"><input type="radio" id="traveler1_visaTypeRadio" value="VisaExempt">Visa-Exempt(include TAC)</label><label class="btnStyle"><input type="radio" value="HoldingVisa">Holding a Visa</label><label class="btnStyle"><input type="radio" value="LandingVisa">Landing Visa</label></div></div>
  <div class="f"><label>Country/ Region Code*</label><input type="text" id="traveler1_phoneCountryCode" data-list="code"></div>
  <div class="f"><label>Mobile Number*</label><input type="text" id="traveler1_phoneNumber"></div>
  <div class="f"><label>Occupation*</label><select id="traveler1_occupation"><option value="">Please Select</option><option value="29">會計員/ACCOUNTANT/CPA</option><option value="11">工程師/ENGINEER</option><option value="24">其他/OTHER</option></select></div>
  <div class="f"><label>Email Address*</label><input type="email" id="traveler1_email"></div>
  <button type="button" class="next" data-to="3">NEXT</button></section>
<section data-step="3" class="hidden"><h2>Itinerary</h2>
  <div class="f"><label>Expected Mode of Entry*</label><div class="radioGrp"><label class="btnStyle"><input type="radio" id="traveler1_arrivalTravelModeFlag" value="AIR">Air</label><label class="btnStyle"><input type="radio" value="SEA">Sea</label></div></div>
  <div class="f"><label>Expected Entry Flight Code*</label><input type="text" id="traveler1_arrivalFlightCode" data-list="airline"></div>
  <div class="f"><label>Expected Entry Flight Number*</label><input type="text" id="traveler1_arrivalFlightNumber" maxlength="5"></div>
  <div class="f"><label>Purpose of Visit*</label><select id="traveler1_reason"><option value="">Please Select</option><option value="16">1.商務 Business</option><option value="213">2.求學 Study</option><option value="1">3.觀光 Sightseeing / Travel / Leisure</option><option value="33">Others</option></select></div>
  <div class="f"><label>Accommodation in Taiwan*</label><div class="radioGrp"><label class="btnStyle"><input type="radio" value="Residential Address">Residential Address</label><label class="btnStyle"><input type="radio" id="traveler1_hotelFlag" value="Hotel Name">Hotel Name</label><label class="btnStyle"><input type="radio" value="Transfer">Transfer</label></div></div>
  <div class="f"><label>Please enter the name of hotel below.</label><input type="text" id="traveler1_address" maxlength="200"></div>
  <button type="button" class="next" data-to="4">NEXT</button></section>
<section data-step="4" class="hidden"><h2>Review</h2><dl id="review"></dl>
  <div class="bar"><label><input type="checkbox" name="declarationCheck" id="decl"> I have read, fully understood, and agree to this declaration, and I take full responsibility.</label>
    <button type="submit" id="submit" disabled>SUBMIT</button></div></section>
<div class="hidden"><input name="name"><input name="sex"><input name="dob"><input name="nationality"><input name="passport_no"><input name="passport_expiry">
  <input name="email"><input name="phone"><input name="mode"><input name="flight_no"><input name="arrival_date"><input name="departure_date">
  <input name="purpose"><input name="accom_type"><input name="accommodation"></div>
</form></main>
<script>
(function () {
  const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
  const show = (el, on) => el.classList.toggle('hidden', !on);
  let at = 1;
  const step = n => { at = n; $$('section[data-step]').forEach(s => show(s, +s.dataset.step === n)); $$('.steps span').forEach(s => s.classList.toggle('on', +s.dataset.s === n));
    history.replaceState(null, '', '/submit' + (n === 4 ? '#review' : n > 1 ? '#step' + n : '')); };
  // a copy opened at #review / #stepN shows that step (the real app keeps it in memory)
  const m = location.hash.match(/^#(review|step(\d))$/); step(m ? (m[1] === 'review' ? 4 : +m[2]) : 1);
  $('#send').addEventListener('click', () => { $('#code').focus(); });
  $('#verify').addEventListener('click', e => { if (at !== 1) return; e.preventDefault();
    if ($('#code').value.trim().toUpperCase() === 'H2VK9') step(2); });
  $$('button.next').forEach(b => b.addEventListener('click', () => step(+b.dataset.to)));
  $$('.radioGrp').forEach(g => g.querySelectorAll('label.btnStyle').forEach(l => l.addEventListener('click', () => {
    g.querySelectorAll('label.btnStyle').forEach(x => x.classList.remove('on')); l.classList.add('on'); g.dataset.value = l.querySelector('input').value; })));
  const LISTS = {country: ['AUS,AUSTRALIA', 'AUT,AUSTRIA', 'CAN,CANADA', 'GBR,UNITED KINGDOM', 'JPN,JAPAN', 'NZL,NEW ZEALAND', 'USA,UNITED STATES'],
    code: ['1 USA/CAN', '44 GBR', '61 AUS', '64 NZL', '65 SGP', '81 JPN', '381 SRB'],
    airline: ['BR : EVA AIRWAYS', 'CI : CHINA AIRLINES', 'JL : JAPAN AIRLINES', 'QF : QANTAS AIRWAYS', '3K : JETSTAR ASIA AIRWAYS']};
  // comboboxes: a fuzzy menu of options as the user types; Enter or a click picks one
  $$('input[data-list]').forEach(inp => {
    const menu = document.createElement('div'); menu.className = 'menu hidden'; inp.after(menu);
    const render = () => { const q = inp.value.trim().toUpperCase(); inp.dataset.picked = '';
      const hits = LISTS[inp.dataset.list].filter(o => o.includes(q)); menu.innerHTML = hits.map(o => `<div class="opt">${o}</div>`).join(''); show(menu, hits.length > 0 && !!q); };
    inp.addEventListener('input', render);
    menu.addEventListener('mousedown', e => e.preventDefault());
    menu.addEventListener('click', e => { const o = e.target.closest('.opt'); if (!o) return; inp.value = o.textContent; inp.dataset.picked = o.textContent; show(menu, false); });
    inp.addEventListener('blur', () => setTimeout(() => show(menu, false), 200));
  });
  $('#decl').addEventListener('change', e => { $('#submit').disabled = !e.target.checked; });
  const v = id => ($('#traveler1_' + id) || {}).value || '', g = id => ($('.radioGrp:has(#traveler1_' + id + ')') || {dataset: {}}).dataset.value || '';
  // only Review submits; Enter in the code box verifies it (as VERIFY CODE does)
  $('#f').addEventListener('submit', e => {
    if (at === 1) { e.preventDefault(); if ($('#code').value.trim().toUpperCase() === 'H2VK9') step(2); return; }
    if (at !== 4) { e.preventDefault(); return; }
    const fc = ($('#traveler1_arrivalFlightCode').dataset.picked || '').split(' : ')[0];
    const out = {name: v('englishName').toUpperCase(), sex: {Male: 'M', Female: 'F'}[g('sex')] || '', dob: v('birthDate'),
      nationality: ($('#traveler1_nation').dataset.picked || '').split(',')[0], passport_no: v('passportNo'), passport_expiry: v('passportExpiryDate'),
      email: v('email').toLowerCase(), phone: ($('#traveler1_phoneCountryCode').dataset.picked ? '+' + $('#traveler1_phoneCountryCode').dataset.picked.split(' ')[0] + ' ' : '') + v('phoneNumber'),
      mode: g('arrivalTravelModeFlag'), flight_no: fc && v('arrivalFlightNumber') ? fc + ' ' + v('arrivalFlightNumber') : '',
      arrival_date: v('expectEntryDate'), departure_date: v('intendedDepartureDate'),
      purpose: {'1': 'HOLIDAY', '16': 'BUSINESS', '213': 'STUDY'}[v('reason')] || '',
      accom_type: {'Hotel Name': 'HOTEL', 'Residential Address': 'OWN', Transfer: 'TRANSIT'}[g('hotelFlag')] || '', accommodation: v('address')};
    for (const [k, x] of Object.entries(out)) { const i = document.querySelector(`#f input[name="${k}"]`); if (i) i.value = x; }
  });
})();
</script></body></html>

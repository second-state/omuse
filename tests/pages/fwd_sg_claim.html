<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Make a travel claim online | FWD Singapore</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{font-family:Arial,Helvetica,sans-serif;margin:0;color:#183028}
header{background:#e87722;color:#fff;padding:14px 32px} header b{font-size:22px;letter-spacing:1px}
main{max-width:760px;margin:20px auto;padding:0 24px} label{display:block;margin:8px 0} input,select,textarea{padding:6px;border:1px solid #999;border-radius:4px;width:300px}
textarea{height:60px} button{background:#e87722;color:#fff;border:0;border-radius:4px;padding:10px 22px;font-size:16px;margin-top:10px}
.tip{background:#fdf1e7;padding:10px;border-radius:4px;font-size:14px}
footer{margin:40px 0 0;padding:16px 32px;background:#183028;color:#ddd;font-size:12px}
</style></head>
<body>
<header><b>FWD</b> &nbsp; Claims</header>
<main>
<h1>Travel claim</h1>
<p class="tip">Tell us within 30 days of the incident. Have your policy number, the airline's delay letter or the Property Irregularity Report, and your receipts ready.</p>
<form id="claim" action="/fwd_sg_claim_done.html" method="get">
  <label>Policy number <input name="policy" id="policy"></label>
  <label>Full name <input name="name" id="name"></label>
  <label>Email <input name="email" id="email"></label>
  <label>Mobile number <input name="mobile" id="mobile"></label>
  <label>NRIC or passport number <input name="idno" id="idno"></label>
  <label>Type of claim <select name="type" id="type"><option>Travel delay</option><option>Trip cancellation</option><option>Baggage</option><option>Medical expenses</option></select></label>
  <label>Date of incident <input name="date" id="date" placeholder="YYYY-MM-DD"></label>
  <label>What happened <textarea name="what" id="what"></textarea></label>
  <label>Amount claimed (SGD) <input name="amount" id="amount"></label>
  <label>Supporting documents <input type="file" name="docs" id="docs"></label>
  <button type="submit" id="submit">Submit claim</button>
</form>
</main>
<footer>FWD Singapore Pte. Ltd. · Overseas emergencies (24 hours): +65 6322 2072 · Customer care: +65 6820 8888</footer>
</body></html>

<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Visit Japan Web</title>
<style>body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f3f4f6}header{background:#c4002b;color:#fff;padding:12px 32px}
header b{display:block;font-size:17px}main{max-width:520px;margin:40px auto;background:#fff;border:1px solid #d7d9dd;padding:24px 32px}
h1{font-size:22px;color:#c4002b}label{display:block;font-weight:bold;font-size:13px;margin:12px 0 4px}
input{width:100%;height:34px;border:1px solid #9aa0a6;border-radius:3px;padding:4px 8px;font-size:15px;box-sizing:border-box}
button{margin-top:18px;height:40px;width:100%;border:0;border-radius:4px;background:#c4002b;color:#fff;font-size:15px;font-weight:bold}
p{font-size:13px;color:#444}</style></head>
<body><header><b>Visit Japan Web</b>Digital Agency, Government of Japan</header>
<main><h1>Log in</h1>
<p>Visit Japan Web lets you complete immigration and customs procedures before you arrive in Japan. Log in with your account to register a planned entry.</p>
<form action="/vjw_entry.html" method="get" id="login">
<label for="email">Email address</label><input type="email" id="email" name="account" autocomplete="off">
<label for="password">Password</label><input type="password" id="password" autocomplete="off">
<button type="submit">Log in</button></form>
<p>No account yet? Create an account (email verification required).</p>
</main>
<script>document.getElementById('login').addEventListener('submit', function (e) {
  if (!document.getElementById('email').value || !document.getElementById('password').value) { e.preventDefault(); alert('Enter your email address and password.'); }
  else document.getElementById('password').removeAttribute('name');
});</script>
</body></html>

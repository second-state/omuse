[workspace]
resolver = "2"
members = ["crates/omuse-common", "crates/omuse-docs", "crates/omuse-web", "crates/omuse-sentinel-core", "crates/omuse-mail", "crates/omuse-apps", "crates/omuse-mcp", "crates/omuse-phone", "crates/omuse-sentinel", "crates/omuse-runtime", "crates/omuse-browser", "crates/omuse"]

[workspace.package]
version = "0.4.8"
edition = "2021"
license = "GPL-3.0-only"
rust-version = "1.85"

[workspace.dependencies]
omuse-common = { path = "crates/omuse-common" }
omuse-docs = { path = "crates/omuse-docs" }
omuse-web = { path = "crates/omuse-web" }
omuse-sentinel-core = { path = "crates/omuse-sentinel-core" }
omuse-mail = { path = "crates/omuse-mail" }
omuse-apps = { path = "crates/omuse-apps" }
omuse-mcp = { path = "crates/omuse-mcp" }
omuse-phone = { path = "crates/omuse-phone" }
omuse-sentinel = { path = "crates/omuse-sentinel" }
omuse-runtime = { path = "crates/omuse-runtime" }
omuse-browser = { path = "crates/omuse-browser" }

# async / web
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-util = { version = "0.7", features = ["io", "codec"] }
futures = "0.3"
futures-util = "0.3"
async-stream = "0.3"
axum = { version = "0.8", features = ["multipart", "ws", "macros", "query", "form"] }
axum-extra = { version = "0.12", features = ["typed-header", "cookie"] }
tower = { version = "0.5", features = ["util", "timeout"] }
tower-http = { version = "0.7", features = ["trace", "set-header", "cors", "normalize-path"] }
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
bytes = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "multipart", "gzip", "cookies"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
url = "2"
percent-encoding = "2"
form_urlencoded = "1"
mime_guess = "2"
mime = "0.3"

# data
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
toml = "0.8"
rusqlite = { version = "0.40", features = ["bundled", "functions", "backup"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde", "clock"] }
chrono-tz = "0.10"
croner = "4"
rrule = { version = "0.14", default-features = false }
regex = "1"
fancy-regex = "0.14"
once_cell = "1"
parking_lot = "0.12"
dashmap = "6"
indexmap = { version = "2", features = ["serde"] }
num-bigint = "0.4"
num-traits = "0.2"
num-integer = "0.1"
unicode-ident = "1"
rand = "0.8"
base64 = "0.22"
hex = "0.4"
sha2 = "0.10"
sha1 = "0.10"
md-5 = "0.10"
hmac = "0.12"
ed25519-dalek = "2"
pbkdf2 = { version = "0.12", features = ["simple"] }
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
subtle = "2"
flate2 = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
tar = "0.4"
walkdir = "2"
tempfile = "3"
include_dir = "0.7"
tera = { version = "1", default-features = false }
html-escape = "0.2"
pulldown-cmark = "0.13"
quick-xml = { version = "0.42", features = ["serialize"] }
roxmltree = "0.21"
scraper = "0.29"
encoding_rs = "0.8"
unicode-segmentation = "1"
unicode-width = "0.2"
unicode-normalization = "0.1"
textwrap = "0.16"
csv = "1"
calamine = "0.37"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff", "ico"] }
imageproc = { version = "0.27", default-features = false, features = ["text"] }
ab_glyph = "0.2"
lopdf = "0.46"
pdf-extract = "0.12"
mail-parser = "0.11"
mail-builder = "0.3"
async-imap = { version = "0.12", default-features = false, features = ["runtime-tokio"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = "1"
webpki-roots = "1"
lettre = { version = "0.11", default-features = false, features = ["tokio1", "tokio1-rustls-tls", "smtp-transport", "builder", "pool", "hostname"] }
chromiumoxide = "0.9"
libc = "0.2"
nix = { version = "0.31", features = ["signal", "process", "user"] }

# misc
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
clap = { version = "4", features = ["derive"] }

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}} · {{date}}</title>
<style>
  @page { size: A4; margin: 14mm 13mm 16mm; }
  :root { --ink: #1a1a1a; --muted: #5b5b5b; --rule: #1a1a1a; --paper: #fbfaf6; --accent: #8a1c1c; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink);
         font: 15px/1.5 Georgia, "Times New Roman", "Noto Serif", "Songti SC", serif; }
  .paper { max-width: 1040px; margin: 0 auto; padding: 28px 32px 40px; }
  header.masthead { text-align: center; border-bottom: 3px double var(--rule); padding-bottom: 10px; }
  .kicker { font: 600 11px/1.4 "Helvetica Neue", Arial, sans-serif; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); }
  h1.name { font: 900 54px/1.05 "Playfair Display", Georgia, serif; margin: 6px 0 4px; letter-spacing: -.01em; }
  .dateline { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap;
              border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); margin-top: 10px; padding: 4px 2px;
              font: 12px/1.4 "Helvetica Neue", Arial, sans-serif; color: var(--muted); }
  .lead { display: grid; grid-template-columns: 2fr 1fr; gap: 26px; padding: 18px 0; border-bottom: 1px solid var(--rule); }
  .lead h2 { font: 800 34px/1.12 Georgia, serif; margin: 0 0 10px; }
  .lead p.summary { font-size: 17px; margin: 0 0 8px; }
  .markets { display: flex; flex-wrap: wrap; gap: 6px 22px; padding: 8px 2px; border-bottom: 1px solid var(--rule);
              font: 13px/1.4 "Helvetica Neue", Arial, sans-serif; }
  .markets b { font-weight: 700; }
  .meta { font: 12px/1.4 "Helvetica Neue", Arial, sans-serif; color: var(--muted); }
  .meta a { color: var(--accent); text-decoration: none; }
  aside.insights { border-left: 1px solid var(--rule); padding-left: 18px; }
  aside.insights h3, section.sources h3 { font: 700 13px/1.3 "Helvetica Neue", Arial, sans-serif; letter-spacing: .14em;
              text-transform: uppercase; margin: 0 0 8px; color: var(--accent); }
  aside.insights ol { margin: 0; padding-left: 18px; }
  aside.insights li { margin-bottom: 8px; }
  .stories { column-count: 3; column-gap: 26px; column-rule: 1px solid #c9c6bd; padding-top: 16px; }
  article.story { break-inside: avoid; margin: 0 0 18px; }
  article.story h4 { font: 700 19px/1.2 Georgia, serif; margin: 0 0 6px; }
  article.story p { margin: 0 0 6px; text-align: justify; hyphens: auto; }
  section.sources { border-top: 1px solid var(--rule); margin-top: 10px; padding-top: 10px; }
  section.sources ol { columns: 2; column-gap: 26px; font: 12px/1.45 "Helvetica Neue", Arial, sans-serif; color: var(--muted);
              margin: 0; padding-left: 18px; }
  section.sources a { color: var(--ink); word-break: break-all; }
  footer { margin-top: 16px; text-align: center; font: 11px/1.4 "Helvetica Neue", Arial, sans-serif; color: var(--muted); }
  @media (max-width: 760px) { .lead { grid-template-columns: 1fr; } aside.insights { border-left: 0; padding-left: 0; }
              .stories { column-count: 1; } h1.name { font-size: 38px; } section.sources ol { columns: 1; } }
  @media print { body { background: #fff; } .paper { padding: 0; max-width: none; }
              .lead { grid-template-columns: 1fr; gap: 12px; } aside.insights { border-left: 0; padding-left: 0; }
              .stories { column-count: 2; } article.story { break-inside: auto; } article.story h4 { break-after: avoid; }
              section.sources { break-inside: avoid; } }
</style>
</head>
<body>
<div class="paper">
  <header class="masthead">
    <div class="kicker">OMuse News Research · {{period}}</div>
    <h1 class="name">{{title}}</h1>
    <div class="dateline"><span>{{date}}</span><span>{{subject}}</span><span>{{edition}}</span></div>
  </header>
  {{markets}}
  <section class="lead">
    <div>{{lead}}</div>
    <aside class="insights">
      <h3>Insights</h3>
      {{insights}}
    </aside>
  </section>
  <section class="stories">
    {{stories}}
  </section>
  <section class="sources">
    <h3>Sources</h3>
    {{sources}}
  </section>
  <footer>Researched from the open web in a browser by OMuse · {{date}}</footer>
</div>
</body>
</html>

# Olares injects userspace / olaresEnv values at install time.
workloads:
  persona:
    replicaCount: 1
userspace:
  appData: /tmp/persona-appdata
  appCache: /tmp/persona-appcache
olaresEnv: {}
image:
  omuse: ghcr.io/second-state/omuse:omuse-v0.4.16   # chart/build.sh pins the release image of the chart's version
  busybox: docker.io/beclab/busybox:1.37
timezone: Asia/Singapore
bfl:
  username: ""

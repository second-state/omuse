  fullDescription: |
    OMuse is a private AI agent that lives on your Olares — local-first, private by default and always on. It doesn't just chat: it plans multi-step tasks and carries them out across your email, documents, team chat and the web, and it asks before doing anything that matters.

    **What it does**

    - **Chat → plan → act** – describe what you need; OMuse makes a plan and works through it step by step, showing every tool call.
    - **Email** – Gmail, Outlook / Hotmail, Yahoo, iCloud, QQ Mail, NetEase 163 / 126, Zoho, AOL or any IMAP mailbox: search, read, draft, reply and send across several mailboxes; one-click unsubscribe from newsletters. Sign-in codes and reset links are hidden from the model.
    - **Notion & Slack** – look things up, write reports into Notion, update task boards, read channels and threads, post messages.
    - **Web browser** – its own Chromium with a restricted API (no arbitrary JavaScript), live view, and human takeover for logins and CAPTCHAs.
    - **MCP connectors** – plug in any MCP server; tool definitions are pinned so a server can't quietly change them.
    - **Automations** – goals it keeps pushing for days until they're achieved, event triggers (new email, Slack message, Notion change) and schedules.
    - **Telegram remote control** – give tasks, follow progress and approve actions with one tap from your phone.
    - **Memory & skills** – remembers what you ask it to remember, and learns reusable skills.

    **Safe by design**

    - **Sentinel** – an independent guard service decides ALLOW / DENY / ASK for every action. Sending, posting, paying and deleting always wait for your approval.
    - **Credentials in a vault** – app passwords and tokens are encrypted in Sentinel; the agent and the model never see them.
    - **Prompt-injection defences** – emails, web pages and tool results are treated as untrusted; suspicious content escalates every write to human approval.
    - **Audit trail** – every model call, tool call, decision and approval goes into an append-only, hash-chained log.

    Runs on the local models served by your Olares by default — any OpenAI-compatible endpoint works. English and 中文 interface.
  upgradeDescription: |
    0.4.16: New FWD travel insurance skill for Singapore and Hong Kong (buy a policy; claim through FWD's online form or bolttech's claim form by email), and PDF links opened in the browser are saved; flight, hotel and car rental searches run once with the profile's preference (all airlines, hotels or companies only when asked), and ask before broadening; a Preferred car rental field in the profile
    0.4.15: A flight question is answered with the flight search alone (it falls back to web search by itself), and each Kiwi.com offer names the airline's own website for booking; hotel and restaurant questions likewise use their own search alone; the profile's "Chinese name" is now "Other name", right after the passport name
    0.4.14: Web search asks the browser's own engines first (free and as fast), then Brave and Exa; new news search on Tavily; flight search falls back from Kiwi.com to Google Flights (with a SerpApi key) to web search, covers a range of dates in one search and counts business itineraries with a short economy leg as business; hotel and restaurant search work without a key through web search; no planning for searches; the profile lists your stored IDs with Add another ID and saves an uploaded ID at once; the model name is gone from the header
    0.4.13: Flight search follows the request (date, cabin, stops; business class never shown as economy) in one search, with city codes covering all airports (TYO = Haneda + Narita); preferred airline and hotel brand in the profile (dropdowns, alliances such as Star Alliance and groups such as IHG count for all their members); "book it" goes straight to the airline page with your details, passport and card filled; health status in English; new sidebar order
    0.4.12: Loading a skill no longer runs the planner: the skill sheet is the procedure and the executor follows it directly (no PLANNING pause); only seven long skills (CSR trip claim, expense report, travel planning, deep research, web comparison, Drive cleanup, photo storybook) carry plan: on and still get a plan
    0.4.11: config.example.toml: the [search] section follows the [endpoints] keys again (the example had put seven endpoint keys under [search])
    0.4.10: One web_search tool on every model call (Exa's free MCP, then your Tavily, Brave or Exa keys, then the browser's own engines; the one that worked last goes first); flight search works out of the box with Kiwi.com data, information only, booked on the airline's site or an agency you choose; a SerpApi key adds Google Flights, Google Hotels and Google Maps restaurant search; server default keys with your own overriding them, marked on the Connections page; the task card shows the turn's seconds and the activity verb moves next to the thinking dots; unlimited custom profile fields
    0.4.9: Faster replies: the agent answers simple requests directly and plans only when the work needs several steps or a skill; the answer appears in the chat while the model writes it (reasoning stays hidden until the answer begins); a new travel skill files a Chase Sapphire trip cancellation / interruption claim when illness made you miss a flight (the deadlines as dates, the airline letter, the physician statement, the claim portal, a claim packet PDF)
    0.4.8: Google Drive connection (one Google sign-in covers Calendar and Drive, your own Google client or the managed one); trip videos in Drive joined, cut, resized, captioned and put back (edit_video over ffmpeg); a photo story book PDF from the trip photos in Drive; Drive clean-up that finds the large and long-unused files and moves the ones you confirm to the bin
    0.4.7: Short AI video clips in the chat (make_video, any OpenAI-style Videos API such as Sora or Grok Imagine); pictures and clips can come from another provider than the chat model, with their own optional endpoint and key, also with your own model in Settings; landscape and portrait pictures from ratio-based image models
    0.4.6: Unlimited addresses in the profile, used by the arrival-card skills for the destination country (the agent asks in chat when there are several); first login opens the profile page, where an ID photo prefills name, date of birth and nationality and the document number goes to the Vault; the Memory tidy card follows the UI language
    0.4.4: Fly.io deployments can read a config file injected outside the data volume
    0.4.3: Now licensed under GPL-3.0; new OMuse images in the Market listing; the approval dialog shows one language only
    0.4.2: Travel skills for Asia (arrival cards for 11 countries, trip today, disruptions, lost bags, expense reports, which card to use) and city guides for 15 Asian cities that answer without the browser; browser actions approved automatically by default (Settings, logins and payments still ask); fast mode and reasoning effort settings
    0.4.1: Parallel plan steps: independent steps run at the same time as sub-agents, each with its own browser tab; the interface shows one language at a time (English by default); settings for parallel model requests
    0.4.0: Rewritten in Rust: one binary for all three services, about 9x less CPU and 6x less memory, faster start; same features and data
    0.2.76: Fixes: browser relaunch after idle shutdown; reply drafts on long threads; caption without Pillow; per-task image budget
    0.2.75: Images: make_image (text-to-image via any OpenAI-Images-compatible endpoint: Olares Router / gpt-image-1 / DALL-E / FLUX / SD; auto model pick, aspect/size fallbacks, styles, negative prompt, transparent background, formats), edit_image (inpainting by mask, prompt edits, reference images), vary_image (variations), caption_image (letter-perfect text on images, CJK), upscale_image (2x/4x local); clear not-configured / moderation / timeout handling
    0.2.74: Browser: Chromium now launches lazily on first web use and shuts down after idle, instead of holding ~2GB at startup (fixes OOM crashes on small-RAM boxes); browser service stays up and healthy even if Chromium cannot start
    0.2.73: Calendar: when Google Calendar is not connected or sign-in expired, calendar_create_event returns a one-tap add-to-calendar link instead of erroring
    0.2.72: Fix OR email search on non-Gmail mailboxes; clearer calendar access-denied message; internal step budgets no longer surfaced to users

metadata:
  title: 'OMuse'
  description: '你的私人 AI 智能体'
spec:
  fullDescription: |
    OMuse 是运行在你的 Olares 上的私人 AI 智能体（local-first / 默认私密 / 7×24 在线）。它不只是聊天：会把你的需求拆成多步计划，在邮件、文档、团队聊天和网页之间把事情做完——而且在做任何重要的事之前都会先问你。名字来自拉丁语 genius loci「守护一方的灵」。

    **能做什么**

    - **对话 → 计划 → 执行**：说出你的需求，OMuse 自动规划并逐步执行，每一次工具调用都看得见。
    - **邮箱**：支持 Gmail、Outlook / Hotmail、Yahoo、iCloud、QQ 邮箱、网易 163 / 126、Zoho、AOL 及任何 IMAP 邮箱，可同时连接多个，搜索、阅读、草稿、回复与发送；营销邮件一键退订；验证码和重置链接对模型自动屏蔽。
    - **Notion 与 Slack**：查资料、把报告写进 Notion、更新任务表；读取频道和讨论串、发送消息。
    - **浏览器**：独立的 Chromium，受限 API（禁止执行任意 JavaScript），实时画面，登录/验证码可由你接管。
    - **MCP 连接器**：接入任意 MCP（Model Context Protocol）服务器，工具定义锁定，防止被悄悄篡改。
    - **自动化**：场景目标（持续推进直到达成）、事件触发（新邮件 / Slack 新消息 / Notion 变化）、定时任务。
    - **Telegram 遥控**：在手机上布置任务、看进度、一键审批。
    - **记忆与技能**：记住你让它记住的事，并沉淀可复用的技能。

    **安全设计**

    - **Sentinel 哨兵**：独立的权限服务，对每个操作做 ALLOW / DENY / ASK 决策；发送、发布、付款、删除一律等你批准。
    - **凭据保险箱**：应用专用密码和令牌加密保存在 Sentinel 中，Agent 和模型永远看不到。
    - **防提示注入**：邮件、网页和工具结果一律视为不可信内容；一旦发现可疑内容，所有写操作都升级为人工审批。
    - **审计记录**：所有模型调用、工具调用、权限决策和审批都写入只追加的哈希链日志。

    默认使用 Olares 本机提供的模型，也可以换成任何 OpenAI 兼容接口。支持中文与 English 界面。
  upgradeDescription: |
    0.4.13：航班搜索按请求的日期、舱位、中转次数一次查完（要公务舱绝不给经济舱），城市码覆盖全部机场（TYO = 羽田 + 成田）；档案新增常用航空公司和常用酒店品牌（下拉选择，星空联盟等航空联盟、IHG 等酒店集团包含全部成员）；“订这个”直接打开航司预订页并填好资料、护照和信用卡；运行状态全英文显示；侧边栏新顺序
    0.4.12：加载技能不再调用规划模型：技能说明书本身就是步骤，执行模型直接照做（不再出现“规划中”停顿）；只有七个长流程技能（CSR 行程理赔、报销单、旅行规划、深度研究、网页对比、Drive 清理、照片故事书）标注 plan: on，仍会先生成计划
    0.4.11：config.example.toml：[search] 段落移回 [endpoints] 之后（示例曾把七个 endpoints 键放到了 [search] 下）
    0.4.10：每次模型调用都带一个 web_search 工具（先试免费的 Exa MCP，再用你填的 Tavily、Brave 或 Exa 密钥，最后用浏览器自带的搜索引擎；上次成功的优先）；机票搜索开箱即用，用 Kiwi.com 的数据、仅供参考，订票在航空公司官网或你选的代理商；填入 SerpApi 密钥后有 Google Flights、Google Hotels 和 Google Maps 餐厅搜索；服务器默认密钥可被你自己的覆盖，连接页标明来源；任务卡片显示本轮用时，活动动词移到思考点旁边；个人资料自定义字段不限数量
    0.4.9：回复更快：简单请求由执行模型直接回答，只有多步骤或需要技能的任务才先规划；回答在模型生成的同时逐步显示在聊天里（推理过程不显示，直到正式回答开始）；新增旅行技能：因生病误机时，为 Chase Sapphire 卡的行程取消/中断保险理赔（时限日期、航空公司书面说明、医生证明、理赔网站、理赔材料包 PDF）
    0.4.8：连接 Google Drive（一次 Google 登录同时连接日历和云端硬盘，可用自己的 Google 客户端或托管客户端）；把 Drive 里的旅行视频拼接、剪辑、缩放、加字幕并放回（edit_video，基于 ffmpeg）；用 Drive 里的旅行照片做故事书 PDF；清理 Drive：找出大文件和很久没打开的文件，确认后移到回收站
    0.4.7：聊天里生成几秒钟的 AI 短视频（make_video，支持 Sora、Grok Imagine 等 OpenAI 风格的视频接口）；图片和视频可以用与聊天模型不同的服务商，各自的接口地址和密钥可选，使用自己的模型时也可在设置中填写；按比例出图的图像模型也能生成横版和竖版图片
    0.4.6：个人资料可填写任意多个地址，入境卡技能使用目的地国家的那个地址（有多个时在聊天中询问）；首次登录直接打开个人资料页，上传证件照片即可预填姓名、出生日期和国籍，证件号码存入保险库；记忆整理卡片跟随界面语言
    0.4.4：Fly.io 部署可以读取数据卷之外注入的配置文件
    0.4.3：改用 GPL-3.0 许可证；应用商店里换成 OMuse 的新图片；审批对话框只显示一种语言
    0.4.2：亚洲旅行技能（11 国电子入境卡、今日行程、航班延误、行李丢失、差旅报销、该刷哪张卡）和 15 个亚洲城市指南（不打开浏览器）；浏览器操作默认自动批准（可在设置中关闭，登录和付款仍会询问）；快速模式和推理强度设置
    0.4.1：并行步骤：互不依赖的步骤由子智能体同时完成，每个有自己的浏览器标签页；界面只显示一种语言（默认英文）；可设置同时进行的模型请求数
    0.4.0：用 Rust 重写：三个服务合为一个程序，CPU 约为原来的 1/9、内存约 1/6，启动更快；功能和数据不变
    0.2.76：修复：空闲后浏览器无法重启；长线程回复草稿失败；加字不依赖 Pillow；每任务图片生成上限
    0.2.75：图像：make_image 文生图（任何 OpenAI Images 兼容端点：Olares Router / gpt-image-1 / DALL·E / FLUX / SD；自动选模型、画幅与尺寸自适应、风格、负向提示、透明背景、格式），edit_image 局部重绘/按提示修改/参考图，vary_image 变体，caption_image 字对字准确地在图上加字（支持中文），upscale_image 本机 2x/4x 放大；未配置/审核拒绝/超时都有清晰提示
    0.2.74：浏览器：Chromium 改为首次使用网页时才启动、空闲后自动关闭，不再开机就常驻约2GB（修复小内存机器的OOM崩溃）；即使Chromium起不来，浏览器服务本身也保持健康不崩
    0.2.73：日历：Google 日历未连接或授权过期时，创建事件会返回一键添加到日历的链接，而不再报错
    0.2.72：修复非 Gmail 邮箱中文 OR 搜索（多关键词被当作全部必须命中）；日历连接被拒的提示更清晰；内部步数/网页预算不再当成额度告诉用户，数量不足改用子 Agent 补齐

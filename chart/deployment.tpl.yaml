{{- $rt := randAlphaNum 40 }}
{{- $bt := randAlphaNum 40 }}
apiVersion: v1
kind: Secret
metadata:
  name: persona-config
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  # The three containers run the same `omuse` binary, one role each, and share this file (see config.example.toml).
  config.toml: |
    [server]
    host = "0.0.0.0"
    port = 8080
    runtime_host = "127.0.0.1"
    runtime_port = 8081
    browser_host = "127.0.0.1"
    browser_port = 8082
    timezone = {{ .Values.timezone | toJson }}
    app_id = "persona"

    [data]
    sentinel = "/sdata"
    runtime = "/data"
    workspace = "/workspace"
    browser_profile = "/bprofile"

    [auth]
    enabled = false   # the Olares entrance logs the user in

    [model]
    url = {{ (.Values.olaresEnv).OMUSE_MODEL_URL | default (printf "https://router.%s.olares.com/v1" (.Values.bfl).username) | toJson }}
    name = {{ (.Values.olaresEnv).OMUSE_MODEL | default "Olares/unsloth/Qwen3.8-27B-GGUF:UD-Q4_K_XL" | toJson }}
    # optional: an OpenAI-Images-compatible endpoint for make_image (gpt-image-1 / DALL·E / a local FLUX or SD server)
    # and its key; the key is never shown in Settings or the audit log
    image_url = {{ (.Values.olaresEnv).OMUSE_IMAGE_URL | default "" | toJson }}
    image_api_key = {{ (.Values.olaresEnv).OMUSE_IMAGE_API_KEY | default "" | toJson }}
    image = {{ (.Values.olaresEnv).OMUSE_IMAGE_MODEL | default "" | toJson }}
    # optional: the same for make_video (an OpenAI-Videos-compatible endpoint: POST /videos, GET /videos/<id>[/content])
    video_url = {{ (.Values.olaresEnv).OMUSE_VIDEO_URL | default "" | toJson }}
    video_api_key = {{ (.Values.olaresEnv).OMUSE_VIDEO_API_KEY | default "" | toJson }}
    video = {{ (.Values.olaresEnv).OMUSE_VIDEO_MODEL | default "" | toJson }}

    [voice]
    port = 8083

    [internal]
    sentinel_url = "http://127.0.0.1:8080"
    runtime_url = "http://127.0.0.1:8081"
    browser_url = "http://127.0.0.1:8082"
    runtime_token = "{{ $rt }}"
    browser_token = "{{ $bt }}"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: persona
  namespace: {{ .Release.Namespace }}
  labels:
    app: persona
spec:
  replicas: {{ .Values.workloads.persona.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: persona
  template:
    metadata:
      labels:
        app: persona
    spec:
      terminationGracePeriodSeconds: 20
      initContainers:
      - name: init-permissions
        image: "{{ .Values.image.busybox }}"
        command: ["sh", "-c", "for d in /sdata /data /workspace /bprofile; do mkdir -p $d && chown -R 1000:1000 $d; done; chmod 700 /sdata"]
        securityContext:
          runAsUser: 0
        volumeMounts:
        - {name: sdata, mountPath: /sdata}
        - {name: rdata, mountPath: /data}
        - {name: workspace, mountPath: /workspace}
        - {name: bprofile, mountPath: /bprofile}
      containers:
      - name: sentinel
        image: "{{ .Values.image.omuse }}"
        imagePullPolicy: IfNotPresent
        command: ["tini", "--", "/opt/omuse/bin/omuse", "--config", "/config/config.toml", "--role", "sentinel"]
        env:
        - {name: TZ, value: "{{ .Values.timezone }}"}
        - {name: HOME, value: /tmp}
        ports:
        - {containerPort: 8080, name: http, protocol: TCP}
        - {containerPort: 8083, name: voice, protocol: TCP}
        readinessProbe:
          httpGet: {path: /sentinel/api/health, port: 8080}
          initialDelaySeconds: 10
          periodSeconds: 10
          failureThreshold: 60
        resources:
          requests: {cpu: 50m, memory: 64Mi}
          limits: {cpu: "2", memory: 1Gi}
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
          allowPrivilegeEscalation: false
        volumeMounts:
        - {name: config, mountPath: /config, readOnly: true}
        - {name: sdata, mountPath: /sdata}
      - name: runtime
        image: "{{ .Values.image.omuse }}"
        imagePullPolicy: IfNotPresent
        command: ["tini", "--", "/opt/omuse/bin/omuse", "--config", "/config/config.toml", "--role", "runtime"]
        env:
        - {name: TZ, value: "{{ .Values.timezone }}"}
        - {name: HOME, value: /tmp}
        resources:
          requests: {cpu: 50m, memory: 64Mi}
          limits: {cpu: "2", memory: 2Gi}
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
          allowPrivilegeEscalation: false
        volumeMounts:
        - {name: config, mountPath: /config, readOnly: true}
        - {name: rdata, mountPath: /data}
        - {name: workspace, mountPath: /workspace}
      - name: browser
        image: "{{ .Values.image.omuse }}"
        imagePullPolicy: IfNotPresent
        command: ["tini", "--", "/opt/omuse/bin/omuse", "--config", "/config/config.toml", "--role", "browser"]
        env:
        - {name: TZ, value: "{{ .Values.timezone }}"}
        - {name: HOME, value: /tmp}
        resources:
          requests: {cpu: 200m, memory: 512Mi}
          limits: {cpu: "3", memory: 4Gi}
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
          allowPrivilegeEscalation: false
        volumeMounts:
        - {name: config, mountPath: /config, readOnly: true}
        - {name: bprofile, mountPath: /bprofile}
        - {name: workspace, mountPath: /workspace}
        - {name: dshm, mountPath: /dev/shm}
      volumes:
      - name: config
        secret:
          secretName: persona-config
          defaultMode: 0444
      - name: sdata
        hostPath:
          path: '{{ .Values.userspace.appCache }}/sentinel'
          type: DirectoryOrCreate
      - name: rdata
        hostPath:
          path: '{{ .Values.userspace.appData }}/runtime'
          type: DirectoryOrCreate
      - name: workspace
        hostPath:
          path: '{{ .Values.userspace.appData }}/workspace'
          type: DirectoryOrCreate
      - name: bprofile
        hostPath:
          path: '{{ .Values.userspace.appCache }}/browser-profile'
          type: DirectoryOrCreate
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: persona
  namespace: {{ .Release.Namespace }}
spec:
  type: ClusterIP
  selector:
    app: persona
  ports:
  - name: http
    protocol: TCP
    port: 8080
    targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: persona-voice
  namespace: {{ .Release.Namespace }}
spec:
  type: ClusterIP
  selector:
    app: persona
  ports:
  - name: voice
    protocol: TCP
    port: 8083
    targetPort: 8083
